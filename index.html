<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="description" content="Fener Yolu: Ramazan gecesi bir Anadolu kasabasında hurma topla, iyilik yap, engellerden kaç.">
<title>Fener Yolu</title>
<style>
  :root {
    color-scheme: dark;
    --gold: #ffd56b;
    --gold-deep: #e8a93a;
    --ink: #fff7e3;
    --panel: rgba(16, 18, 48, 0.92);
    --panel-edge: rgba(255, 213, 107, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b1030;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    display: none; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));
    pointer-events: none; font-weight: 700; font-size: 16px;
    text-shadow: 0 2px 3px rgba(0,0,0,.6);
  }
  #hud.show { display: flex; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(10, 12, 36, .55); border: 1px solid rgba(255,213,107,.25);
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .hearts { color: #ff6b7a; letter-spacing: 2px; font-size: 18px; }
  .hearts .off { color: rgba(255,255,255,.25); }
  .ico-trash { width: 9px; height: 14px; border-radius: 2px; background: linear-gradient(#b8c0cc 0 30%, #d63b30 30% 70%, #b8c0cc 70%); display: inline-block; }
  .ico-date { width: 10px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #b06a3a, #5a2a12 70%); display: inline-block; transform: rotate(-20deg); }
  .ico-light { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle, #fff6c8, #ffd56b 50%, rgba(255,213,107,0) 75%); display: inline-block; box-shadow: 0 0 8px #ffd56b; }
  .ico-heart { color: #8fe3a0; }
  #hud { flex-wrap: wrap; padding-right: calc(64px + env(safe-area-inset-right)); row-gap: 6px; }
  #hud .spacer { flex: 1; }
  #carry { display: none; }
  #carry.show { display: inline-flex; }
  @media (max-width: 560px) {
    #hud { font-size: 14px; gap: 6px; }
    .chip { padding: 3px 8px; }
    .hearts { font-size: 15px; letter-spacing: 1px; }
    .lbl { display: none; }
  }
  #pauseBtn {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
    pointer-events: auto; width: 42px; height: 42px; border-radius: 12px;
    border: 1px solid rgba(255,213,107,.4); background: rgba(10,12,36,.6); color: var(--ink);
    font-size: 18px; font-weight: 800; cursor: pointer;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px;
    padding: 10px 16px; font-weight: 600; font-size: 16px; max-width: min(90vw, 520px); text-align: center;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  body.race #toast { top: calc(88px + env(safe-area-inset-top)); }
  body.race3d #toast { top: calc(132px + env(safe-area-inset-top)); }

  /* ---------- Touch controls ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.show { display: block; }
  #touch, .tbtn, canvas#c { touch-action: none; -webkit-touch-callout: none; }
  .tbtn {
    position: absolute; pointer-events: auto; touch-action: none;
    width: 78px; height: 78px; border-radius: 50%;
    background: rgba(255, 247, 227, .14); border: 2px solid rgba(255, 213, 107, .45);
    color: var(--ink); font-size: 30px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .tbtn.on { background: rgba(255, 213, 107, .45); }
  #padL { left: calc(16px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); }
  #padR { left: calc(108px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); }
  #padJ { right: calc(18px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 92px; height: 92px; font-size: 18px; }
  #padU, #padD { display: none; right: calc(28px + env(safe-area-inset-right)); }
  #padU { bottom: calc(108px + env(safe-area-inset-bottom)); }
  #padD { bottom: calc(18px + env(safe-area-inset-bottom)); }
  body.maze #padU, body.maze #padD { display: flex; }
  body.maze #padJ { display: none; }
  body.race3d #touch .tbtn, body.race3d #padZone, body.maze #touch .tbtn, body.maze #padZone, body.snake #touch .tbtn, body.snake #padZone { display: none !important; }
  #padZone { position: absolute; pointer-events: auto; touch-action: none;
    left: 0; bottom: 0; width: calc(200px + env(safe-area-inset-left)); height: 130px; }

  /* ---------- Overlay screens ---------- */
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(6, 8, 26, .55);
    overflow-y: auto; touch-action: pan-y;
  }
  #overlay.hide { display: none; }
  .card {
    width: min(520px, 100%); background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 22px; padding: 22px 22px 18px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    margin: auto;
  }
  .card h1 { margin: 4px 0 2px; font-size: clamp(34px, 8vw, 52px); color: var(--gold); letter-spacing: .5px;
    text-shadow: 0 0 22px rgba(255, 213, 107, .45); }
  .card h2 { margin: 2px 0 10px; font-size: 24px; color: var(--gold); }
  .card p { margin: 6px 0; line-height: 1.5; font-size: 16px; color: #efe6d0; }
  .sub { opacity: .85; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .btn {
    appearance: none; border: 0; border-radius: 14px; padding: 13px 16px; font-size: 18px; font-weight: 700;
    cursor: pointer; color: #2a1a05; background: linear-gradient(#ffe08a, #f0b440);
    box-shadow: 0 4px 0 #a8701e; touch-action: manipulation; font-family: inherit;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a8701e; }
  .btn.alt { background: rgba(255,255,255,.08); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(255,213,107,.35); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .quote {
    margin: 14px 0 6px; padding: 14px 14px 12px; border-radius: 14px;
    background: rgba(255, 213, 107, .08); border: 1px solid rgba(255, 213, 107, .25);
  }
  .quote .q { font-size: 18px; line-height: 1.5; color: #fff3cf; font-style: italic; }
  .quote .src { margin-top: 8px; font-size: 13px; color: #d9c89c; }
  .stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
  .help { text-align: left; }
  .help li { margin: 6px 0; line-height: 1.45; }
  .muted { font-size: 13px; opacity: .7; margin-top: 12px; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  .namein { width: 100%; font: inherit; font-size: 20px; font-weight: 700; text-align: center; padding: 12px 14px; border-radius: 14px;
    border: 2px solid var(--panel-edge); background: rgba(255,255,255,.08); color: var(--ink); outline: none; }
  .namein:focus { border-color: var(--gold); }
  .err { color: #ff9a9a; min-height: 1.3em; margin: 6px 0 0; font-weight: 600; }
  .who { margin: 0 0 10px; font-size: 15px; opacity: .9; }
  .who b { color: var(--gold); }
  .linkbtn { background: none; border: 0; color: var(--gold); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 2px 4px; }
  .lb { list-style: none; margin: 10px 0 0; padding: 0; text-align: left; max-height: 52vh; overflow-y: auto; }
  .lb li { display: grid; grid-template-columns: 2.2em 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; font-variant-numeric: tabular-nums; }
  .lb li:nth-child(odd) { background: rgba(255,255,255,.05); }
  .lb li.me { background: rgba(255,213,107,.18); outline: 1px solid rgba(255,213,107,.5); }
  .lb .rk { font-weight: 800; color: var(--gold); text-align: right; }
  .lb .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .lb .st { opacity: .8; font-size: 14px; }
  .lb .pt { font-weight: 800; }
  .grid2 .btn { font-size: 16px; padding: 11px 8px; }
  .st-on { color: #ffd56b; text-shadow: 0 0 6px rgba(255,213,107,.6); }
  .st-off { color: rgba(255,255,255,.22); }
  .stars { font-size: 14px !important; letter-spacing: 2px; margin-top: 2px; }
  .bigstars { font-size: 44px; letter-spacing: 6px; margin: 2px 0 4px; line-height: 1.1; }
  .total { margin: 4px 0 0; }
  .ico-card { width: 10px; height: 13px; background: #f3e3b8; border-top: 2px solid #d8c08a; border-bottom: 2px solid #d8c08a; display: inline-block; box-shadow: inset 4px 0 0 -2px #3f8a4a; }
  .ico-time { font-size: 13px; }
  .besttime { color: #cfe7ff; letter-spacing: 0; font-weight: 600; white-space: nowrap; }
  @media (max-width: 420px) { .levels small:not(.stars) { display: none; } .levels .btn { padding: 9px 4px; } }
  .leaf { font-size: 34px; color: #c8f0b0; text-shadow: 0 0 14px rgba(200,255,190,.6); }
  .medal { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.35); font-size: 15px; border: 1px solid rgba(255,255,255,.15); }
  .medal.on { background: radial-gradient(circle at 35% 30%, #ffe9a0, #e0a33a); color: #5a3a10; border-color: #ffd56b; box-shadow: 0 0 10px rgba(255,213,107,.5); }
  .badges { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; margin-top: 8px; }
  .badge { display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 12px; background: rgba(255,255,255,.04); opacity: .6; }
  .badge.on { opacity: 1; background: rgba(255,213,107,.08); }
  .badge small { display: block; font-size: 12px; opacity: .8; line-height: 1.3; }
  .badge-new { display: flex; align-items: center; justify-content: center; gap: 8px; color: #ffe08a; }
  .notebook { display: grid; gap: 8px; text-align: left; margin-top: 8px; max-height: 52vh; overflow-y: auto; padding-right: 4px; }
  .note { padding: 10px 12px; border-radius: 12px; background: rgba(255,213,107,.07); border: 1px solid rgba(255,213,107,.2); }
  .note .q { font-style: italic; margin-top: 4px; line-height: 1.45; color: #fff3cf; }
  .note .src { font-size: 12px; color: #d9c89c; margin-top: 4px; }
  .note.locked { opacity: .55; border-style: dashed; }
  @media (max-width: 560px) { .chip.wide { display: none; } .badges { grid-template-columns: 1fr; } }
  .levels .btn { padding: 12px 6px; font-size: 16px; }
  .levels small { display: block; font-size: 12px; font-weight: 600; opacity: .8; }
  #rotateHint { display: none; font-size: 13px; opacity: .8; margin-top: 8px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotateHint { display: block; } }
  @media (max-height: 430px) {
    .card { padding: 14px 16px 12px; }
    .card h1 { font-size: 34px; }
    .card p { font-size: 14px; margin: 3px 0; }
    .btns { margin-top: 10px; gap: 8px; }
    .btn { padding: 9px 12px; font-size: 16px; }
    .quote { margin: 8px 0 4px; padding: 10px; }
    .quote .q { font-size: 15px; }
    .bigstars { font-size: 32px; }
    .levels .btn { padding: 8px 4px; font-size: 14px; }
    .grid2 .btn { padding: 8px 6px; font-size: 14px; }
    .card { width: min(760px, 100%); }
    .card p.sub + p.sub { display: none; }
    .levels { grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
    .levels small { font-size: 11px; }
    .grid2 { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .levels { grid-template-columns: repeat(6, 1fr); }
    .levels small:not(.stars) { display: none; }
    .levels .btn { padding: 7px 3px; }
    .total { margin: 2px 0 0; font-size: 13px; }
    .card h1 { font-size: 28px; margin: 0; }
    .muted { display: none; }
    .notebook { max-height: 46vh; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <span class="chip hearts" id="hHearts">♥♥♥</span>
  <span class="chip"><i class="ico-date"></i><span id="hDates">0</span></span>
  <span class="chip"><i class="ico-light"></i><span id="hLights">0</span></span>
  <span class="chip"><span class="ico-heart">❀</span><span id="hDeeds">İyilik 0/0</span></span>
  <span class="chip"><i class="ico-card"></i><span id="hCards">0/0</span></span>
  <span class="chip wide"><span class="ico-time">⏱</span><span id="hTime">0:00</span></span>
  <span class="chip" id="carry"></span>
  <span class="spacer"></span>
  <button id="pauseBtn" aria-label="Duraklat">II</button>
</div>

<div id="toast"></div>

<div id="touch">
  <div id="padZone"></div>
  <div class="tbtn" id="padL" aria-hidden="true">◀</div>
  <div class="tbtn" id="padR" aria-hidden="true">▶</div>
  <div class="tbtn" id="padJ" aria-label="Zıpla">ZIPLA</div>
  <div class="tbtn" id="padU" aria-label="Yukarı">▲</div>
  <div class="tbtn" id="padD" aria-label="Aşağı">▼</div>
</div>

<div id="overlay"></div>

class LB {
  constructor(w) {
    this.w = w;
    this.g = [];
    for (let y = 0; y < ROWS; y++) this.g.push(new Array(w).fill('.'));
  }
  set(x, y, c) { if (x >= 0 && x < this.w && y >= 0 && y < ROWS) this.g[y][x] = c; return this; }
  ground(x0, x1, top = 11, c = '#') { for (let x = x0; x < x1; x++) for (let y = top; y < ROWS; y++) this.set(x, y, c); return this; }
  block(x, y, w, h, c = '#') { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) this.set(x + i, y + j, c); return this; }
  plat(x, y, len, c = '-') { for (let i = 0; i < len; i++) this.set(x + i, y, c); return this; }
  row(x, y, n, c = 'o', step = 1) { for (let i = 0; i < n; i++) this.set(x + i * step, y, c); return this; }
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mixColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16), q = clamp(t, 0, 1);
  const c = (sh) => Math.round(((pa >> sh) & 255) + ((((pb >> sh) & 255) - ((pa >> sh) & 255)) * q));
  return '#' + ((c(16) << 16) | (c(8) << 8) | c(0)).toString(16).padStart(6, '0');
}
const lerp = (a, b, t) => a + (b - a) * t;
function rand(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const Sound = {
  ctx: null, on: store.get('ses', true),
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  play(name) {
    switch (name) {
      case 'jump': this.tone(420, 0.14, 'triangle', 0.08, 260); break;
      case 'jump2': this.tone(620, 0.16, 'triangle', 0.08, 420); this.tone(1240, 0.12, 'sine', 0.05, 0, 0.05); break;
      case 'date': this.tone(880, 0.08, 'sine', 0.09); this.tone(1320, 0.1, 'sine', 0.07, 0, 0.05); break;
      case 'light': [660, 880, 1100, 1320].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.07, 0, i * 0.05)); break;
      case 'pick': this.tone(520, 0.1, 'triangle', 0.1); this.tone(780, 0.12, 'triangle', 0.08, 0, 0.07); break;
      case 'deed': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.3, 'sine', 0.09, 0, i * 0.09)); break;
      case 'check': this.tone(587, 0.2, 'sine', 0.09); this.tone(880, 0.3, 'sine', 0.08, 0, 0.1); break;
      case 'hurt': this.tone(300, 0.3, 'square', 0.06, -180); break;
      case 'win': [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.35, 'sine', 0.09, 0, i * 0.12)); break;
      case 'hint': this.tone(440, 0.12, 'sine', 0.05); break;

      case 'bonk': this.tone(160, 0.25, 'sawtooth', 0.05, -80); break;

    }
  },
};

// Ortam sesi: çalgı yok, yalnızca doğa sesleri (rüzgâr, cırcır böceği, kuş)
const Amb = {
  on: store.get('ortam', true), nodes: null, timer: 0, kind: null,
  start(kind) {
    this.stop();
    if (!this.on || !Sound.ctx) return;
    const c = Sound.ctx;
    this.kind = kind;
    const len = c.sampleRate * 3, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let lastv = 0;
    for (let i = 0; i < len; i++) { lastv = (lastv + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = lastv * 3.5; }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = kind === 'kar' ? 650 : 380;
    const g = c.createGain(); const base = kind === 'kar' ? 0.06 : 0.03; g.gain.value = base;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.08;
    const lg = c.createGain(); lg.gain.value = base * 0.6;
    lfo.connect(lg); lg.connect(g.gain);
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(); lfo.start();
    this.nodes = [src, lfo, g, f, lg];
    this.timer = setInterval(() => this.tick(), 300);
  },
  tick() {
    if (!Sound.ctx || !this.on) return;
    const r = Math.random();
    if (this.kind === 'gece' && r < 0.4) this.cricket();
    else if (this.kind === 'gunbatimi' && r < 0.14) this.bird();
    else if (this.kind === 'gunduz' && r < 0.25) this.bird();
  },
  cricket() {
    const c = Sound.ctx, t0 = c.currentTime, n = 2 + Math.floor(Math.random() * 3), fq = 4200 + Math.random() * 400;
    for (let i = 0; i < n; i++) {
      const o = c.createOscillator(), g = c.createGain(), st = t0 + i * 0.07;
      o.frequency.value = fq;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.005, st + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.045);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + 0.06);
    }
  },
  bird() {
    const c = Sound.ctx, t0 = c.currentTime;
    for (let i = 0; i < 2; i++) {
      const o = c.createOscillator(), g = c.createGain(), st = t0 + i * 0.16;
      o.frequency.setValueAtTime(2300, st); o.frequency.exponentialRampToValueAtTime(3400, st + 0.09);
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.012, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.12);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + 0.14);
    }
  },
  stop() {
    clearInterval(this.timer); this.timer = 0;
    if (this.nodes) for (const n of this.nodes) { try { if (n.stop) n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} }
    this.nodes = null;
  },
  forLevel() { const th = THEMES[S.lv ? S.lv.theme : 0]; return th.amb || 'gece'; },
};

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  // En az 11 satır yükseklik ve 12.5 karo genişlik görünsün
  scale = Math.min(H / (11 * T), W / (12.5 * T));
  viewW = W / scale; viewH = H / scale;
  offY = 0;
  if (viewH > WORLD_H) {
    // Dik ekran: dünyayı üste yerleştir, dokunmatik tuşlara alttan yer bırak
    const ctrl = isTouch() ? Math.min(H * 0.34, 230) : 0;
    const free = H - ctrl - WORLD_H * scale;
    offY = Math.max(0, free * 0.55);
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

function loadLevel(i) {
  const lv = LEVELS[i];
  S.li = i; S.lv = lv; S.w = lv.w;
  S.grid = lv.grid.map(r => r.slice());

    const c = S.grid[y][x];

      case 'D': S.ents.push({ k: 'recv', needs: 'pide', who: 'komsu', x: px + 16, y: py + 32, done: false, t: 0 }); S.deedsTotal++; break;
      case 'Y': S.ents.push({ k: 'recv', needs: 'kutu', who: 'yavrukedi', x: px + 16, y: py + 32, done: false, t: 0 }); S.deedsTotal++; break;
      case 'J': S.ents.push({ k: 'pad', x: px, y: py + T, sq: 0 }); break;
      case '7': S.ents.push({ k: 'ktree', x: px + 16, top: py, kite: false }); break;
      case '8': S.ents.push({ k: 'ktree', x: px + 16, top: py, kite: true, freed: false, fy: 0 }); S.deedsTotal++; break;
      case 'v': S.ents.push({ k: 'item', item: 'fide', x: px + 16, y: py + 24, hx: px + 16, hy: py + 24, held: false, used: false }); break;
      case 'u': S.ents.push({ k: 'recv', needs: 'fide', who: 'cukur', x: px + 16, y: py + 32, done: false, t: 0 }); S.deedsTotal++; break;
      case 'Q': S.ents.push({ k: 'bad', x: px + 16, y: py + 16, r: 15, ph: (x * 0.9) % 6, label: BAD_TRAITS[S.ents.filter(e => e.k === 'bad').length % BAD_TRAITS.length] }); break;
      case 'U': S.ents.push({ k: 'good', x: px + 16, y: py + 16, r: 14, ph: (x * 0.7) % 6, label: GOOD_TRAITS[S.ents.filter(e => e.k === 'good').length % GOOD_TRAITS.length] }); S.deedsTotal++; break;
      case 'f': S.ents.push({ k: 'item', item: 'cicek', x: px + 16, y: py + 24, hx: px + 16, hy: py + 24, held: false, used: false }); break;
      case 'h': S.ents.push({ k: 'item', item: 'seker', x: px + 16, y: py + 24, hx: px + 16, hy: py + 24, held: false, used: false }); break;
      case 'H': S.ents.push({ k: 'recv', needs: 'cicek', who: 'komsu2', x: px + 16, y: py + 32, done: false, t: 0 }); S.deedsTotal++; break;
      case 'G': S.ents.push({ k: 'recv', needs: 'seker', who: 'cocuklar', x: px + 16, y: py + 32, done: false, t: 0 }); S.deedsTotal++; break;
      case 'Z': {
        let gy = y + 1; while (gy < ROWS && !solidAt(x, gy)) gy++;
        S.ents.push({ k: 'snow', x: px + 16, y0: py + 6, gy: gy * T, per: 2.8, ph: (x * 0.53) % 2.8, prev: 0, fall: false, cy: 0, cvy: 0, warn: false });
        break;
      }
      case 'R': S.ents.push({ k: 'spawner', x: px + 16, y: py + 16, t: 1.2 }); break;
      case 'P': {
        // İp uzunluğu: saksının en alt noktası zeminin biraz üstüne gelsin
        let gy = y + 1; while (gy < ROWS && !solidAt(x, gy)) gy++;
        const ay = py - 2;
        const len = Math.max(60, gy * T - 18 - ay);
        S.ents.push({ k: 'pot', ax: px + 16, ay, len, ph: (x * 0.7) % 6, x: 0, y: 0, r: 12 });
        break;
      }
      case 'A': S.ents.push({ k: 'bee', bx: px + 16, by: py + 16, x: px + 16, y: py + 16, r: 10, ph: (x * 1.3) % 6, range: 70 }); break;
      case 'M': S.ents.push({ k: 'mplat', bx: px - 16, by: py + 4, x: px - 16, y: py + 4, w: 96, h: 14, axis: 'x', range: 72, sp: 0.9, ph: 0, dx: 0, dy: 0 }); break;
      case 'V': S.ents.push({ k: 'mplat', bx: px - 16, by: py + 4, x: px - 16, y: py + 4, w: 96, h: 14, axis: 'y', range: 80, sp: 0.8, ph: 0, dx: 0, dy: 0 }); break;
    }
  }
  // Bilgi yaprakları
  const seen = store.get('bilgi', []);
  S.cardsGot = 0; S.cardsTotal = 0;
  for (const [cx, cy, id] of ((lv.mode3d || lv.maze || lv.snake) ? [] : (CARD_POS[i] || []))) {
    S.ents.push({ k: 'card', id, x: cx * T + 16, y: cy * T + 16, r: 14, ph: cx % 6, seen: seen.includes(id), got: false });
    S.cardsTotal++;
  }
  // Havada duran hurma ve ışıkları Kerem'in takkesine değmeyecek kadar yukarı al
  for (const e of S.ents) {
    if (e.k !== 'date' && e.k !== 'light') continue;
    const tx = Math.floor(e.x / T);
    let ty = Math.floor(e.y / T) + 1;
    while (ty < ROWS && !solidAt(tx, ty) && tileAt(tx, ty) !== '-') ty++;
    if (ty >= ROWS) continue;
    const floorY = ty * T, dist = floorY - e.y;
    if (dist > 32 && dist < 78) e.y = floorY - 78;
  }
  S.start = start;
  S.check = { x: start.x, y: start.y };
  S.p = makePlayer(start.x, start.y);
  S.race = null;
  if (lv.race) {
    // Tahta araba: daha geniş ve yüksek gövde (Kerem oturuyor)
    S.p.w = 36; S.p.h = 34; S.p.y = start.y + PH - S.p.h; S.p.vx = 140;
    S.race = { cx: start.x - 9 * T, slowT: 0, boostT: 0, hitCool: 0, wheel: 0, count: 3.0, beep: 4, startX: start.x };
    S.p.vx = 0;
  }
  S.cam.x = clamp(S.p.x - viewW * 0.35, 0, Math.max(0, S.w * T - viewW));
  S.cam.y = WORLD_H - Math.min(viewH, WORLD_H);
  if (lv.kite) for (const e of S.ents) if (e.k === 'bad') { e.r = 22; e.sc = 1.5; }
  S.r3 = null; S.mz = null; S.sn = null;
  if (lv.mode3d) setup3D();
  if (lv.maze) setupMaze();
  if (lv.snake) setupSnake();
  updateHud();
}

const BAD_TRAITS = ['Yalan', 'Öfke', 'Kıskançlık', 'Gıybet', 'Kibir', 'Cimrilik', 'Tembellik'];
const GOOD_TRAITS = ['Sabır', 'Doğruluk', 'Merhamet', 'Cömertlik', 'Tevazu', 'Şükür', 'Sevgi', 'Yardımseverlik'];

function makePlayer(x, y) {
  return { x, y, vx: 0, vy: 0, w: PW, h: PH, onGround: false, coyote: 0, buffer: 0, face: 1,
    inv: 0, carry: null, walkT: 0, blinkT: 2, plat: null, squash: 0, airJumps: 1, spin: 0 };
}

// =====================================================================
//  Fizik
// =====================================================================
function moveBody(b, dt, oneWay) {
  const res = { wall: false, ground: false, ceil: false };
  // X ekseni
  b.x += b.vx * dt;
  if (b.vx !== 0) {
    const y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
    if (b.vx > 0) {
      const tx = Math.floor((b.x + b.w) / T);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = tx * T - b.w - 0.001; b.vx = 0; res.wall = true; break; }
    } else {
      const tx = Math.floor(b.x / T);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = (tx + 1) * T + 0.001; b.vx = 0; res.wall = true; break; }
    }
  }
  // Y ekseni
  const prevBottom = b.y + b.h;
  b.y += b.vy * dt;
  const x0 = Math.floor((b.x + 1) / T), x1 = Math.floor((b.x + b.w - 1) / T);
  if (b.vy > 0) {
    const ty = Math.floor((b.y + b.h) / T);
    for (let tx = x0; tx <= x1; tx++) {
      const c = tileAt(tx, ty);
      if (SOLID.has(c) || (oneWay && c === '-' && prevBottom <= ty * T + 0.5)) {
        b.y = ty * T - b.h; b.vy = 0; res.ground = true; break;
      }
    }
  } else if (b.vy < 0) {
    const ty = Math.floor(b.y / T);
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { b.y = (ty + 1) * T + 0.001; b.vy = 0; res.ceil = true; break; }
  }
  return res;
}

function circleRect(cx, cy, r, x, y, w, h) {
  const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

// Yarış: araba kendiliğinden ilerler; ▶ hızlandırır, ◀ yavaşlatır
function raceDrive(p, dt) {
  const R = S.race;
  if (R.count > 0) {
    // Geri sayım: 3 - 2 - 1 - BAŞLA!
    R.count -= dt; p.vx = 0;
    const n = Math.ceil(R.count);
    if (n < R.beep) { R.beep = n; if (n > 0) Sound.tone(520, 0.18, 'square', 0.05); else Sound.tone(1040, 0.35, 'square', 0.06); }
    return;
  }
  let target = input.right ? 320 : input.left ? 165 : 235;
  if (R.slowT > 0) { R.slowT -= dt; target = 115; }
  if (R.boostT > 0) { R.boostT -= dt; target += 110; }
  const a = target > p.vx ? 520 : 900;
  p.vx += clamp(target - p.vx, -a * dt, a * dt);
  p.face = 1;
  if (R.hitCool > 0) R.hitCool -= dt;
  // Çamur yavaşlatır
  if (p.onGround) {
    const tx = Math.floor((p.x + p.w / 2) / T), ty = Math.floor((p.y + p.h - 2) / T);
    if (tileAt(tx, ty) === '~') { R.slowT = Math.max(R.slowT, 0.25); if (!S.hints.camur) { S.hints.camur = true; toast('Çamur arabanı yavaşlatır! Üstünden zıpla.'); } }
  }
  R.wheel += p.vx * dt / 7;
}

// Uçurtma: Kerem kendiliğinden ilerler; basılı tutunca yükselir, bırakınca süzülür
function kiteUpdate(dt) {
  const p = S.p;
  const up = input.jump || input.up;
  p.vx = S.easy ? 125 : 150;
  const target = up ? -200 : 100;
  p.vy += (target - p.vy) * Math.min(1, dt * 3.2);
  p.x += p.vx * dt; p.y += p.vy * dt;
  const gy = 11 * T - p.h;
  p.onGround = false;
  if (p.y >= gy) { p.y = gy; p.vy = Math.min(p.vy, 0); p.onGround = true; }
  if (p.y < 6) { p.y = 6; p.vy = Math.max(p.vy, 0); }
  if (p.x > S.w * T - 60) p.x = S.w * T - 60;
  p.face = 1; p.walkT += dt * 9; if (p.inv > 0) p.inv -= dt;
  input._jumpPrev = input.jump;
}
function kiteHit(label) {
  const p = S.p;
  if (p.inv > 0 || S.mode !== 'play') return;
  S.lives--; p.inv = 1.6; p.vy = 140;
  Sound.play('hurt'); burst(p.x + p.w / 2, p.y + p.h / 2, 14, '#ffd56b', 160); floatText(p.x + p.w / 2, p.y - 20, label + '!');
  updateHud();
  if (S.lives <= 0) { S.mode = 'over'; showOver(); }
}

function updatePlayer(dt) {
  const p = S.p;
  // Hareketli tahtaya bin
  if (p.plat) { p.x += p.plat.dx; p.y += p.plat.dy; }

  if (S.race) raceDrive(p, dt);
  else {
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const acc = p.onGround ? ACC_G : ACC_A;
  if (dir !== 0) {
    p.vx += dir * acc * dt;
    p.vx = clamp(p.vx, -RUN, RUN);
    p.face = dir;
  } else if (p.onGround) {
    const f = FRIC * dt;
    p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
  } else {
    p.vx *= (1 - 1.5 * dt);
  }
  }

  // Zıplama (tampon + coyote süresi)
  const pressed = input.jump && !input._jumpPrev;
  if (pressed) p.buffer = BUFFER;
  input._jumpPrev = input.jump;
  p.buffer -= dt; p.coyote -= dt;
  if (p.onGround) { p.coyote = COYOTE; p.airJumps = 1; }
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP_V; p.buffer = 0; p.coyote = 0; p.onGround = false; p.plat = null;
    p.squash = -0.2; Sound.play('jump');
    burst(p.x + p.w / 2, p.y + p.h, 5, '#d8c9a8', 60);
  } else if (pressed && !p.onGround && p.coyote <= 0 && p.airJumps > 0) {
    // Havada ikinci zıplama (Boşluğa / ZIPLA tuşuna iki kez bas)
    p.airJumps--; p.vy = -JUMP_V * 0.95; p.buffer = 0; p.spin = 1; p.boost = false;
    Sound.play('jump2');
    burst(p.x + p.w / 2, p.y + p.h, 12, '#ffe9a0', 110);
  }
  if (p.spin > 0) p.spin = Math.max(0, p.spin - dt * 2.6);
  if (p.boost && p.vy >= 0) p.boost = false;
  if (!input.jump && p.vy < -260 && !p.boost) p.vy = -260;   // kısa basış = alçak zıplama

  p.vy = Math.min(p.vy + GRAV * dt, MAXFALL);
  const wasGround = p.onGround;
  const r = moveBody(p, dt, true);
  p.onGround = r.ground;
  p.plat = null;

  // Hareketli tahtalar (üstten basılır)
  if (p.vy >= 0) {
    for (const e of S.ents) {
      if (e.k !== 'mplat') continue;
      const top = e.y;
      const bottom = p.y + p.h;
      if (p.x + p.w > e.x + 2 && p.x < e.x + e.w - 2 && bottom >= top - 1 && bottom - p.vy * dt - e.dy <= top + 3) {
        p.y = top - p.h; p.vy = 0; p.onGround = true; p.plat = e; break;
      }
    }
  }
  // Zıplama minderi
  for (const e of S.ents) {
    if (e.k !== 'pad') continue;
    const top = e.y - 10;
    if (p.vy >= 0 && p.x + p.w > e.x + 3 && p.x < e.x + 29 && p.y + p.h >= top - 1 && p.y + p.h <= e.y + 1) {
      p.y = top - p.h; p.vy = -JUMP_V * 1.55; p.onGround = false; p.plat = null; p.coyote = 0; p.buffer = 0;
      p.airJumps = 1; p.boost = true; p.squash = -0.3; e.sq = 1;
      Sound.play('boing'); burst(e.x + 16, top, 10, '#ffd56b', 120);
      break;
    }
  }
  if (p.onGround && !wasGround) { p.squash = 0.25; burst(p.x + p.w / 2, p.y + p.h, 4, '#d8c9a8', 40); }
  p.squash *= Math.pow(0.001, dt);

  if (p.onGround && Math.abs(p.vx) > 10) p.walkT += dt * Math.abs(p.vx) / 18; else p.walkT = 0;
  p.blinkT -= dt; if (p.blinkT < -0.12) p.blinkT = 2 + Math.random() * 3;
  if (p.inv > 0) p.inv -= dt;

  // Uçurumdan düşme
  if (p.y > WORLD_H + 40) hurt(true);
}

function hurt(fell) {
  const p = S.p;
  if (S.mode !== 'play') return;
  if (!fell && p.inv > 0) return;
  S.lives--;
  Sound.play('hurt');
  burst(p.x + p.w / 2, p.y + p.h / 2, 14, '#ffd56b', 160);
  updateHud();
  S.mode = 'dying'; S.dieT = 0.75;
}

function respawn() {
  const p = S.p;
  if (S.lives <= 0) { S.mode = 'over'; showOver(); return; }
  p.x = S.check.x; p.y = S.check.y; p.vx = 0; p.vy = 0; p.inv = 1.6; p.plat = null;
  if (S.race) {
    p.y = S.check.y + PH - p.h; p.vx = 120;
    S.race.cx = p.x - 9 * T; S.race.slowT = 0; S.race.boostT = 0;
    if (S.race.caught) { S.race.caught = false; toast('Kötü huylar bulutu yetişti! Güzel huyları topla, hızını koru.', 3000); }
  }
  // Elindeki eşya kaybolmasın: yanında taşımaya devam eder
  S.barrels = S.barrels.filter(b => Math.abs(b.x - p.x) > 260);
  S.mode = 'play'; S.fade = 0.6;
}

// =====================================================================
//  Varlıklar
// =====================================================================
const barrelSpeed = () => S.easy ? 80 : 115;

function updateEnts(dt) {
  const p = S.p, t = S.time;
  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  for (const e of S.ents) {
    switch (e.k) {
      case 'date':
      case 'light': {
        if (e.got) break;
        const bob = Math.sin(t * 3 + e.ph) * 3;
        if (circleRect(e.x, e.y + bob, e.r, p.x, p.y, p.w, p.h)) {
          e.got = true;
          if (e.k === 'date') { S.dates++; Sound.play('date'); burst(e.x, e.y, 6, S.lv.trash ? '#cfd4dc' : '#c47a3a', 90); if (S.lv.trash && S.dates === 1) toast('Çöpleri topla, tepe tertemiz olsun!'); }
          else { S.lights++; Sound.play('light'); burst(e.x, e.y, 16, '#ffe9a0', 150); floatText(e.x, e.y - 10, 'Kayıp ışık!'); }
          updateHud();
        }
        break;
      }
      case 'flag': {
        if (!e.lit && p.x + p.w > e.x + 8 && p.x < e.x + 24 && p.y + p.h > e.y - 40) {
          e.lit = true;
          S.check = { x: e.x + (T - PW) / 2, y: e.y + T - PH };
          Sound.play('check'); burst(e.x + 16, e.y - 30, 12, '#ffd56b', 110);
          toast('Fener yandı — buradan devam edeceksin.');
        }
        break;
      }
      case 'end': {
        if (S.mode === 'play' && p.x + p.w > e.x - 8 && (S.lv.kite || (p.x < e.x + 56 && p.y + p.h > e.y - 60))) finishLevel();
        break;
      }
      case 'item': {
        if (e.used) break;
        if (e.held) { e.x = pcx; e.y = p.y - (HERO.ok ? 20 : 6); break; }
        if (!p.carry && circleRect(e.x, e.y - 8, 14, p.x, p.y, p.w, p.h)) {
          e.held = true; p.carry = e; Sound.play('pick');
          const msg = { su: 'Su tasını aldın. Susamış kediyi bul!', yavru: 'Kuş yavrusunu aldın. Yuvasına götür!', yem: 'Yem kesesini aldın. Güvercinleri bul!', pide: 'Sıcak pideyi aldın. Yaşlı komşunun kapısına götür!', fide: 'Bir fidan aldın. Yakındaki çukura dik!', kutu: 'Battaniyeli bir kutu buldun. Üşüyen yavru kediye götür!', cicek: 'Bir demet çiçek aldın. Yaşlı komşuyla bayramlaşmaya git!', seker: 'Bayram şekerlerini aldın. Komşu çocuklarına götür!' }[e.item];
          toast(msg); updateHud();
        }
        break;
      }
      case 'recv': {
        if (e.done) { e.t += dt; break; }
        const near = Math.abs(pcx - e.x) < 30 && Math.abs((p.y + p.h) - e.y) < 50;
        if (!near) break;
        if (p.carry && p.carry.item === e.needs) {
          e.done = true; e.t = 0;
          p.carry.used = true; p.carry.held = false; p.carry = null;
          S.deeds++; Sound.play('deed');
          burst(e.x, e.y - 20, 18, '#ff9fb0', 120);
          const msg = { kedi: 'İyilik: Kediye su verdin!', yuva: 'İyilik: Yavru yuvasına kavuştu!', guvercin: 'İyilik: Güvercinlere yem verdin!', komsu: 'İyilik: Komşuya iftarlık pide götürdün!', cukur: 'İyilik: Bir fidan diktin! Tepe yeşeriyor.', yavrukedi: 'İyilik: Yavru kedi artık sıcacık!', komsu2: 'İyilik: Yaşlı komşuyla bayramlaştın!', cocuklar: 'İyilik: Çocuklara bayram şekeri verdin!' }[e.who];
          floatText(e.x, e.y - (e.who === 'komsu' || e.who === 'komsu2' ? 86 : 50), e.who === 'komsu' ? 'Allah razı olsun!' : e.who === 'komsu2' ? 'Bayramın mübarek olsun!' : '♥'); toast(msg); updateHud();
        } else if (S.hintCool <= 0) {
          S.hintCool = 3.5; Sound.play('hint');
          const msg = { kedi: 'Bu kedi çok susamış. Yakınlarda bir su tası olmalı.', yuva: 'Yuva boş… Düşen bir kuş yavrusu var mı?', guvercin: 'Güvercinler aç. Bir yem kesesi bulabilir misin?', komsu: 'Yaşlı komşu iftarını tek başına açacak. Ona bir pide götürebilir misin?', cukur: 'Buraya bir fidan dikilebilir. Yakında bir fidan var mı?', yavrukedi: 'Bu yavru kedi üşüyor. Ona sıcak bir yer bulabilir misin?', komsu2: 'Yaşlı komşu bayramda yalnız. Ona çiçek götürüp bayramlaşabilirsin.', cocuklar: 'Komşu çocukları bayram şekeri bekliyor!' }[e.who];
          toast(msg);
        }
        break;
      }
      case 'spawner': {
        const dx = e.x - pcx;
        if (dx > 130 && dx < viewW * 0.9 + 80) {
          e.t -= dt;
          if (e.t <= 0) { e.t = S.easy ? 4.2 : 3.1; S.barrels.push({ x: e.x - 13, y: e.y - 13, w: 26, h: 26, vx: -barrelSpeed(), vy: 0, rot: 0, life: 16 }); }
        } else e.t = Math.min(e.t, 0.8);
        break;
      }
      case 'pot': {
        const a = 0.62 * Math.sin(S.ht * 1.3 + e.ph);
        e.x = e.ax + Math.sin(a) * e.len; e.y = e.ay + Math.cos(a) * e.len; e.a = a;
        if (circleRect(e.x, e.y, e.r - 2, p.x + 2, p.y + 2, p.w - 4, p.h - 4)) hurt(false);
        break;
      }
      case 'bee': {
        e.x = e.bx + Math.sin(S.ht * 1.2 + e.ph) * e.range;
        e.y = e.by + Math.sin(S.ht * 4.2 + e.ph) * 14;
        e.dir = Math.cos(S.ht * 1.2 + e.ph) >= 0 ? 1 : -1;
        if (circleRect(e.x, e.y, e.r - 2, p.x + 2, p.y + 2, p.w - 4, p.h - 4)) hurt(false);
        break;
      }
      case 'pad': { if (e.sq > 0) e.sq = Math.max(0, e.sq - dt * 3); break; }
      case 'ktree': {
        if (e.kite && !e.freed && circleRect(e.x, e.top - 20, 22, p.x, p.y, p.w, p.h)) {
          e.freed = true; S.deeds++; Sound.play('deed'); burst(e.x, e.top - 20, 18, '#ff9fb0', 120);
          floatText(e.x, e.top - 44, '♥'); toast('İyilik: Ağaca takılan uçurtmayı kurtardın!'); updateHud();
        }
        if (e.freed) e.fy += dt * 60;
        if (p.inv <= 0 && (circleRect(e.x, e.top + 34, 30, p.x + 3, p.y + 3, p.w - 6, p.h - 6) || (p.x + p.w - 4 > e.x - 7 && p.x + 4 < e.x + 7 && p.y + p.h > e.top + 60))) kiteHit('Dal');
        break;
      }
      case 'bad': {
        e.by = e.y + Math.sin(t * 2.5 + e.ph) * 4;
        if (S.lv.kite && p.inv <= 0 && circleRect(e.x, e.by, e.r - 3, p.x + 3, p.y + 3, p.w - 6, p.h - 6)) kiteHit(e.label);
        if (S.race && S.race.hitCool <= 0 && circleRect(e.x, e.by, e.r - 3, p.x + 3, p.y + 3, p.w - 6, p.h - 6)) {
          S.race.slowT = 0.9; S.race.hitCool = 1.0;
          Sound.play('bonk'); burst(e.x, e.by, 12, '#4a4460', 120); floatText(e.x, e.by - 24, e.label + '!');
        }
        break;
      }
      case 'good': {
        if (e.got) break;
        const gy = e.y + Math.sin(t * 3 + e.ph) * 3;
        if (circleRect(e.x, gy, e.r, p.x, p.y - 8, p.w, p.h + 8)) {
          e.got = true; S.deeds++;
          if (S.race) { S.race.boostT = 1.3; S.race.cx -= 3 * T; }
          Sound.play('boost'); burst(e.x, gy, 16, '#fff2a0', 140); floatText(e.x, gy - 20, e.label);
          updateHud();
        }
        break;
      }
      case 'card': {
        if (e.got) break;
        if (circleRect(e.x, e.y + Math.sin(t * 2 + e.ph) * 3, e.r, p.x, p.y - 16, p.w, p.h + 16)) {
          e.got = true; S.cardsGot++; updateHud();
          Sound.play('light'); burst(e.x, e.y, 14, '#d8f0c0', 120);
          if (e.seen) toast('Bu bilgi yaprağını daha önce okumuştun.');
          else openCard(e.id);
        }
        break;
      }
      case 'snow': {
        const tt = (S.ht + e.ph) % e.per;
        e.warn = tt < 0.8 && !e.fall;
        if (e.prev < 0.8 && tt >= 0.8 && !e.fall) { e.fall = true; e.cy = e.y0; e.cvy = 0; }
        e.prev = tt;
        if (e.fall) {
          e.cvy += GRAV * 0.6 * dt; e.cy += e.cvy * dt;
          if (e.cy >= e.gy - 8) {
            e.fall = false; burst(e.x, e.gy - 6, 10, '#f4f8ff', 90);
            if (Math.abs(e.x - pcx) < viewW * 0.6) Sound.play('snow');
          } else if (circleRect(e.x, e.cy, 8, p.x + 2, p.y + 2, p.w - 4, p.h - 4)) hurt(false);
        }
        break;
      }
      case 'mplat': {
        const nx = e.axis === 'x' ? e.bx + Math.sin(t * e.sp + e.ph) * e.range : e.bx;
        const ny = e.axis === 'y' ? e.by + Math.sin(t * e.sp + e.ph) * e.range : e.by;
        e.dx = nx - e.x; e.dy = ny - e.y; e.x = nx; e.y = ny;
        break;
      }
    }
  }
  if (S.hintCool > 0) S.hintCool -= dt;

  // Kovalayan kötü huylar bulutu
  if (S.race) {
    const R = S.race;
    if (R.count <= 0) R.cx += (S.easy ? 200 : 224) * dt;
    R.cx = Math.max(R.cx, p.x - 12 * T);
    if (R.cx + 10 >= p.x) { R.caught = true; hurt(true); return; }
  }

  // İlk karşılaşmada kısa ipucu (her bölümde bir kez)
  for (const e of S.ents) {
    const kind = e.k === 'spawner' ? 'fici' : e.k === 'pot' ? 'saksi' : e.k === 'bee' ? 'ari' : e.k === 'mplat' ? 'tahta' : e.k === 'pad' ? (S.race ? 'rampa' : 'minder') : e.k === 'snow' ? 'kar' : e.k === 'bad' ? (S.lv.kite ? 'kotuK' : 'kotu') : e.k === 'good' ? 'guzel' : (e.k === 'ktree' && e.kite) ? 'takili' : e.k === 'ktree' ? 'agac' : null;
    if (!kind || S.hints[kind]) continue;
    const ex = e.k === 'pot' ? e.ax : (e.bx != null ? e.bx : e.x);
    if (ex - pcx > 0 && ex - pcx < Math.min(viewW * 0.55, 330)) {
      S.hints[kind] = true;
      toast({ fici: S.lv.tumble ? 'Kuru dal topları yuvarlanıyor! Üstlerinden zıpla.' : S.lv.theme === 4 ? 'Kartopları yuvarlanıyor! Üstlerinden zıpla.' : 'Fıçılar yuvarlanıyor! Üstlerinden zıpla.', saksi: 'Sallanan saksı! Uzaklaştığı anı bekle, sonra hızla geç.', ari: 'Arının altından yürüyerek geç. Üstüne zıplama!', tahta: 'Hareketli tahtaya zıpla, seni karşıya taşısın.', minder: 'Zıplama minderi! Üstüne bas, seni yükseğe fırlatsın.', kar: 'Saçaktan kar düşüyor! Titrediğini görünce bekle, düşünce geç.', kotuK: 'Kötü huy bulutlarına çarparsan bir can gider. Etrafından uç!', takili: 'Ağaca bir uçurtma takılmış! Ağacın hemen üstünden geçip onu kurtar.', agac: 'Ağaç dallarına çarpma! Üstünden uç.', rampa: 'Zıplama minderi! Üstünden geçince araban uçar.', kotu: 'Kötü huy bulutlarına çarparsan yavaşlarsın. Üstlerinden zıpla!', guzel: 'Güzel huyları topla: hızlanırsın, kara bulut geri çekilir!' }[kind], 3200);
      break;
    }
  }

  // Dikenli çalılar
  const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w) / T);
  const y0 = Math.floor(p.y / T), y1 = Math.floor((p.y + p.h) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (tileAt(tx, ty) === '^') {
      if (p.x + p.w > tx * T + 6 && p.x < tx * T + T - 6 && p.y + p.h > ty * T + 14) hurt(false);
    }
  }

  // Fıçılar
  for (const b of S.barrels) {
    b.vy = Math.min(b.vy + GRAV * dt, MAXFALL);
    const r = moveBody(b, dt, false);
    if (r.wall) { b.life = 0; burst(b.x + 13, b.y + 13, 10, '#8a5a2b', 120); }
    else b.vx = -barrelSpeed();
    b.rot += b.vx * dt / 13;
    b.life -= dt;
    if (circleRect(b.x + 13, b.y + 13, 10, p.x + 3, p.y + 3, p.w - 6, p.h - 5)) hurt(false);
  }
  S.barrels = S.barrels.filter(b => b.life > 0 && b.y < WORLD_H + 60);
}

const fmtTime = (sec) => { const s = Math.floor(sec); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// Rozetler: verilen anlık koşullar + birikmiş kayıtlar
function checkBadges(now) {
  const have = store.get('rozet', []);
  const sb = store.get('yildiz', {}), done = store.get('bitti', {}), it = store.get('iyilikTam', {}), bilgi = store.get('bilgi', []);
  const all = (m) => LEVELS.every((_, i) => m[i]);
  const cond = Object.assign({
    iyilik: all(it),
    bilgi: CARDS.every(c => bilgi.includes(c.id)),
    yildiz: LEVELS.every((_, i) => (sb[i] || 0) >= 3),
    bayram: all(done),
  }, now);
  const earned = [];
  for (const b of BADGES) if (cond[b.id] && !have.includes(b.id)) { have.push(b.id); earned.push(b); }
  if (earned.length) store.set('rozet', have);
  return earned;
}

function openCard(id) {
  const c = CARDS.find(x => x.id === id);
  if (!c) return;
  const got = store.get('bilgi', []);
  if (!got.includes(id)) { got.push(id); store.set('bilgi', got); }
  const earned = checkBadges({});
  S.mode = 'card';
  input.left = input.right = input.jump = false;
  showOverlay(`
    <div class="leaf">✎</div>
    <h2>Bilgi Yaprağı: ${c.title}</h2>
    <div class="quote"><div class="q">${c.text}</div><div class="src">${c.src}</div></div>
    <p class="sub">Bilgi Defteri: ${got.length} / ${CARDS.length}</p>
    ${earned.map(b => `<p class="badge-new"><span class="medal on">${b.icon}</span> Yeni rozet: <b>${b.name}</b></p>`).join('')}
    <div class="btns"><button class="btn" data-act="ok" data-primary>Devam Et</button></div>
  `);
  bind({ ok: closeCard });
}
function closeCard() {
  if (S.mode !== 'card') return;
  hideOverlay(); S.mode = 'play'; input.left = input.right = input.jump = false; last = performance.now();
}

function starsNow() {
  const allDeeds = S.deeds === S.deedsTotal;
  const allLights = S.lights === S.lightsTotal;
  const manyDates = S.dates >= Math.ceil(S.datesTotal * 0.75);
  return 1 + (allDeeds ? 1 : 0) + (allDeeds && allLights && manyDates ? 1 : 0);
}
const starStr = (n) => '<span class="st-on">' + '★'.repeat(n) + '</span><span class="st-off">' + '★'.repeat(3 - n) + '</span>';

function finishLevel() {
  S.mode = 'complete';
  Sound.play('win');
  const next = S.li + 1;
  const un = store.get('acik', 1);
  if (next + 1 > un && next < LEVELS.length) store.set('acik', next + 1);
  const best = store.get('rekor', {});
  const prev = best[S.li] || 0;
  const score = S.dates + S.lights * 5 + S.deeds * 10;
  if (score > prev) { best[S.li] = score; store.set('rekor', best); }
  const stars = starsNow();
  const sb = store.get('yildiz', {});
  const prevStars = sb[S.li] || 0;
  if (stars > prevStars) { sb[S.li] = stars; store.set('yildiz', sb); }
  // Süre rekoru
  const tm = store.get('sure', {});
  const prevTime = tm[S.li] || 0;
  const newTime = !prevTime || S.runTime < prevTime;
  if (newTime) { tm[S.li] = Math.round(S.runTime * 10) / 10; store.set('sure', tm); }
  // Bölüm kayıtları
  const done = store.get('bitti', {}); done[S.li] = 1; store.set('bitti', done);
  if (S.deeds === S.deedsTotal) { const it = store.get('iyilikTam', {}); it[S.li] = 1; store.set('iyilikTam', it); }
  lbCache = null; lbSend(false);
  const earned = checkBadges({
    ilk: true,
    saglam: S.lives === S.maxLives,
    hurma: S.dates === S.datesTotal,
    isik: S.lights === S.lightsTotal,
    hiz: S.runTime <= LEVEL_PAR[S.li],
  });
  Amb.stop();
  setTimeout(() => showComplete(score, prev, stars, prevStars, { time: S.runTime, prevTime, newTime, earned }), 900);
}

// =====================================================================
//  Parçacıklar ve yazılar
// =====================================================================
function burst(x, y, n, color, sp) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (0.4 + Math.random() * 0.6);
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.5 + Math.random() * 0.4, max: 0.9, color, r: 1.5 + Math.random() * 2 });
  }
}
function floatText(x, y, text) { S.floats.push({ x, y, text, life: 1.2 }); }
function updateParts(dt) {
  for (const q of S.parts) { q.vy += 300 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  S.parts = S.parts.filter(q => q.life > 0);
  for (const f of S.floats) { f.y -= 30 * dt; f.life -= dt; }
  S.floats = S.floats.filter(f => f.life > 0);
}

// =====================================================================
//  Ana güncelleme
// =====================================================================
function update(dt) {
  if ((S.mode === 'play' || S.mode === 'dying') && !(S.race && S.race.count > 0) && !(S.r3 && S.r3.count > 0)) {
    S.runTime += dt;
    const sec = Math.floor(S.runTime);
    if (sec !== S.hudSec) { S.hudSec = sec; const el = document.getElementById('hTime'); if (el) el.textContent = fmtTime(S.runTime); }
  }
  if (S.sn) {
    if (S.mode === 'play') updateSnake(dt);
    else if (S.mode === 'complete') S.time += dt;
    if (S.mode !== 'pause' && S.mode !== 'menu') updateParts(dt);
    if (S.fade > 0) S.fade = Math.max(0, S.fade - dt * 1.8);
    return;
  }
  if (S.mz) {
    if (S.mode === 'play') updateMaze(dt);
    else if (S.mode === 'complete') S.time += dt;
    if (S.fade > 0) S.fade = Math.max(0, S.fade - dt * 1.8);
    return;
  }
  if (S.r3) {
    if (S.mode === 'play') update3D(dt);
    else if (S.mode === 'dying') { S.dieT -= dt; if (S.dieT <= 0) respawn3D(); }
    else if (S.mode === 'complete') { S.r3.pos += S.r3.speed * dt; S.r3.speed *= Math.pow(0.4, dt); S.time += dt; }
    if (S.fade > 0) S.fade = Math.max(0, S.fade - dt * 1.8);
    return;
  }
  if (S.mode === 'play') {
    S.time += dt;
    S.ht += dt * (S.easy ? 0.7 : 1);
    if (S.lv.kite) kiteUpdate(dt); else updatePlayer(dt);
    if (S.mode === 'play') updateEnts(dt);
  } else if (S.mode === 'dying') {
    S.time += dt;
    S.dieT -= dt;
    if (S.dieT <= 0) respawn();
  } else if (S.mode === 'complete') {
    S.time += dt;
  }
  if (S.mode !== 'pause' && S.mode !== 'menu') updateParts(dt);
  if (S.fade > 0) S.fade = Math.max(0, S.fade - dt * 1.8);

  // Kamera
  if (S.p) {
    const p = S.p;
    const look = p.face * 40;
    const tx = clamp(p.x + p.w / 2 - viewW * ((S.race || S.lv.kite) ? 0.3 : 0.42) + look, 0, Math.max(0, S.w * T - viewW));
    S.cam.x = lerp(S.cam.x, tx, Math.min(1, dt * 6));
    if (viewH >= WORLD_H) S.cam.y = 0;
    else {
      const ty = clamp(p.y + p.h / 2 - viewH * 0.55, 0, WORLD_H - viewH);
      S.cam.y = lerp(S.cam.y, ty, Math.min(1, dt * 5));
    }
  }
}

const STARS = (() => { const r = rand(7); const a = []; for (let i = 0; i < 140; i++) a.push({ x: r(), y: r() * 0.7, s: 0.5 + r() * 1.4, ph: r() * 6 }); return a; })();
const moonCv = (() => {
  // Önce hilal biçimini ayrı bir tuvalde kes, sonra ışıltıyla çiz
  const m = document.createElement('canvas'); m.width = m.height = 120;
  const mg = m.getContext('2d');
  mg.fillStyle = '#fff3c4';
  mg.beginPath(); mg.arc(60, 60, 30, 0, Math.PI * 2); mg.fill();
  mg.globalCompositeOperation = 'destination-out';
  mg.beginPath(); mg.arc(74, 51, 26, 0, Math.PI * 2); mg.fill();
  const c = document.createElement('canvas'); c.width = c.height = 120;
  const g = c.getContext('2d');
  g.shadowColor = 'rgba(255,233,160,.8)'; g.shadowBlur = 18;
  g.drawImage(m, 0, 0);
  return c;
})();

// Uzak siluet: kubbeler ve minareler (tekrarlanan desen)
const SKY_PATTERN = (() => {
  const r = rand(42), items = [];
  let x = 0;
  while (x < 2400) {
    const kind = r();
    if (kind < 0.18) { items.push({ t: 'mosque', x, w: 260 }); x += 300 + r() * 120; }
    else { items.push({ t: 'house', x, w: 50 + r() * 70, h: 40 + r() * 70 }); x += 50 + r() * 60; }
  }
  return { items, len: x };
})();
const MID_PATTERN = (() => {
  const r = rand(99), items = [];
  let x = 0;
  while (x < 1800) {
    const w = 70 + r() * 80, h = 90 + r() * 90;
    const wins = []; const nw = Math.floor(w / 26);
    for (let i = 0; i < nw; i++) for (let j = 0; j < 3; j++) if (r() < 0.45) wins.push({ i, j, on: r() < 0.7 });
    items.push({ x, w, h, wins, cumba: r() < 0.5, roof: r() < 0.6 });
    x += w + 10 + r() * 40;
  }
  return { items, len: x };
})();

function drawBackground(th) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const groundLine = offY + (11 * T - S.cam.y) * scale;
  const g = ctx.createLinearGradient(0, 0, 0, Math.max(groundLine, 1));
  g.addColorStop(0, th.skyA); g.addColorStop(0.65, th.skyB); g.addColorStop(1, th.skyC);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Yıldızlar
  for (const s of STARS) {
    const a = 0.45 + 0.45 * Math.sin(S.time * 1.5 + s.ph * 3 + performance.now() / 1600);
    ctx.globalAlpha = Math.min(1, a * (th.starA ?? 1));
    ctx.fillStyle = '#fff8dc';
    ctx.fillRect(((s.x * W * 1.3 - S.cam.x * scale * 0.03) % W + W) % W, s.y * groundLine, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // Kadir gecesi: daha çok yıldız
  if (th.starA > 1) {
    for (const s of STARS) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(performance.now() / 900 + s.ph * 5);
      ctx.fillStyle = '#fffbe8';
      ctx.fillRect(((s.y * W * 1.7 + s.x * 300 - S.cam.x * scale * 0.02) % W + W) % W, s.x * groundLine * 0.85, s.s * 0.8, s.s * 0.8);
    }
    ctx.globalAlpha = 1;
  }
  // Gün batımı: ufka inen güneş
  if (th.sunset) {
    const sr = Math.max(40, 70 * Math.min(1.4, scale));
    const sg = ctx.createRadialGradient(W * 0.3, groundLine - sr * 0.2, 0, W * 0.3, groundLine - sr * 0.2, sr * 2.4);
    sg.addColorStop(0, 'rgba(255,214,140,.55)'); sg.addColorStop(1, 'rgba(255,160,90,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, groundLine);
    ctx.fillStyle = '#ffc27a'; ctx.beginPath(); ctx.arc(W * 0.3, groundLine - sr * 0.2, sr, Math.PI, 0); ctx.fill();
  }
  const ms = Math.min(1.2, Math.max(0.6, scale));
  if (th.day) {
    // Bayram sabahı güneşi ve bulutlar
    const sx = W * 0.8, sy = Math.max(40, groundLine * 0.16), sr = 34 * ms;
    const sg2 = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 4);
    sg2.addColorStop(0, 'rgba(255,250,210,.9)'); sg2.addColorStop(1, 'rgba(255,250,210,0)');
    ctx.fillStyle = sg2; ctx.fillRect(sx - sr * 4, sy - sr * 4, sr * 8, sr * 8);
    ctx.fillStyle = '#fff7cf'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 5; i++) {
      const cxp = ((i * 397 - S.cam.x * scale * 0.08 + performance.now() / 120 * (0.3 + i * 0.05)) % (W + 300) + W + 300) % (W + 300) - 150;
      const cyp = groundLine * (0.18 + (i % 3) * 0.1);
      ctx.beginPath(); ctx.arc(cxp, cyp, 18 * ms, 0, Math.PI * 2); ctx.arc(cxp + 22 * ms, cyp - 8 * ms, 22 * ms, 0, Math.PI * 2); ctx.arc(cxp + 46 * ms, cyp, 16 * ms, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    // Hilal
    ctx.globalAlpha = th.sunset ? 0.55 : 1;
    ctx.drawImage(moonCv, W * 0.78 - 60 * ms, Math.max(10, groundLine * 0.12) , 120 * ms, 120 * ms);
    ctx.globalAlpha = 1;
  }

  const u = scale; // dünya birimi → piksel
  if (th.country) drawCountry(th, groundLine, u);
  else {
  // Uzak katman
  ctx.fillStyle = th.far;
  const farShift = S.cam.x * 0.18 * u;
  const farBase = groundLine - 30 * u;
  const plen = SKY_PATTERN.len * u;
  for (let rep = Math.floor(farShift / plen) - 1; rep <= Math.floor((farShift + W) / plen) + 1; rep++) {
    for (const it of SKY_PATTERN.items) {
      const x = (it.x * u + rep * plen) - farShift;
      if (x > W + 300 * u || x + it.w * u * 1.2 < -300 * u) continue;
      if (it.t === 'house') { ctx.fillRect(x, farBase - it.h * u, it.w * u, it.h * u + 40 * u); }
      else drawMosqueSilhouette(x, farBase, u, th);
    }
  }
  // Yakın katman: evler
  const midShift = S.cam.x * 0.45 * u;
  const midBase = groundLine;
  const mlen = MID_PATTERN.len * u;
  for (let rep = Math.floor(midShift / mlen) - 1; rep <= Math.floor((midShift + W) / mlen) + 1; rep++) {
    for (const it of MID_PATTERN.items) {
      const x = it.x * u + rep * mlen - midShift;
      if (x > W || x + it.w * u < 0) continue;
      const top = midBase - it.h * u;
      ctx.fillStyle = th.mid;
      ctx.fillRect(x, top, it.w * u, it.h * u);
      if (it.roof) { ctx.beginPath(); ctx.moveTo(x - 6 * u, top); ctx.lineTo(x + it.w * u / 2, top - 22 * u); ctx.lineTo(x + it.w * u + 6 * u, top); ctx.fill(); }
      if (it.cumba) ctx.fillRect(x + it.w * u * 0.2, top + 22 * u, it.w * u * 0.6, 34 * u);
      for (const wn of it.wins) {
        ctx.fillStyle = wn.on ? th.win : 'rgba(0,0,0,.25)';
        ctx.globalAlpha = wn.on ? 0.55 + 0.1 * Math.sin(performance.now() / 900 + wn.i) : 1;
        ctx.fillRect(x + (8 + wn.i * 26) * u, top + (30 + wn.j * 28) * u, 10 * u, 14 * u);
      }
      ctx.globalAlpha = 1;
    }
  }
  }
  // Bayram süsleri: renkli bayrak dizileri
  if (th.day && !th.country) {
    const gShift = S.cam.x * 0.45 * u, span = 260 * u;
    const cols = ['#e8506a', '#ffd56b', '#4fb4e8', '#8fd86a', '#f3e6c8'];
    for (let k = Math.floor(gShift / span) - 1; k <= Math.floor((gShift + W) / span) + 1; k++) {
      const x0 = k * span - gShift, y0 = groundLine - 150 * u - ((k % 2 + 2) % 2) * 20 * u;
      ctx.strokeStyle = 'rgba(90,60,40,.6)'; ctx.lineWidth = Math.max(1, u);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(x0 + span / 2, y0 + 30 * u, x0 + span, y0); ctx.stroke();
      for (let i = 1; i < 12; i++) {
        const tt = i / 12, fx = x0 + span * tt, fy = y0 + Math.sin(tt * Math.PI) * 15 * u;
        ctx.fillStyle = cols[(i + k * 3 + 50) % cols.length];
        ctx.beginPath(); ctx.moveTo(fx - 6 * u, fy); ctx.lineTo(fx + 6 * u, fy); ctx.lineTo(fx, fy + 12 * u); ctx.fill();
      }
    }
  }
  // Dik ekranda dünyanın altını doldur
  const worldBottom = offY + (WORLD_H - S.cam.y) * scale;
  if (worldBottom < H) { ctx.fillStyle = '#1a1230'; ctx.fillRect(0, worldBottom, W, H - worldBottom); }
}

const BILLBOARDS = ['Güzel huylar kazanır!', 'Doğru söyle, rahat et!', 'Önce güzel ahlak!', 'Kardeşine gülümse!', 'Sabreden derviş muradına ermiş', 'Yardımlaşalım!'];

function drawTrackBg(th, gl, u) {
  // Uzak tepe
  const sh0 = S.cam.x * 0.1 * u;
  ctx.fillStyle = '#a8d4a0'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 16) ctx.lineTo(x, gl - 150 * u - Math.sin((x + sh0) / (230 * u)) * 24 * u);
  ctx.lineTo(W, H); ctx.fill();
  // Tribünler, ışık direkleri ve reklam panoları
  const sh = S.cam.x * 0.4 * u, sp = 420 * u;
  for (let k = Math.floor(sh / sp) - 1; k <= Math.floor((sh + W) / sp) + 1; k++) {
    const x0 = k * sp - sh, r = rand(1000 + k * 7919);
    // Tribün (3 basamak)
    const sw = 260 * u, base = gl - 16 * u;
    for (let t = 0; t < 3; t++) {
      const ty = base - (t + 1) * 30 * u;
      ctx.fillStyle = t % 2 ? '#c3c8d2' : '#d4d8e0'; ctx.fillRect(x0 + t * 10 * u, ty, sw - t * 20 * u, 30 * u);
      ctx.fillStyle = 'rgba(0,0,0,.1)'; ctx.fillRect(x0 + t * 10 * u, ty + 26 * u, sw - t * 20 * u, 4 * u);
      // Seyirciler (renkli noktalar)
      for (let i = 0; i < 22 - t * 2; i++) {
        const hx = x0 + t * 10 * u + 8 * u + i * ((sw - t * 20 * u - 16 * u) / (21 - t * 2));
        const bob = Math.sin(performance.now() / 260 + i + k) * 1.5 * u;
        ctx.fillStyle = ['#e8506a', '#4fb4e8', '#ffd56b', '#8fd86a', '#b06ad8', '#f39a4a'][Math.floor(r() * 6)];
        ctx.fillRect(hx - 3 * u, ty + 12 * u + bob, 6 * u, 9 * u);
        ctx.fillStyle = '#f2c9a0'; ctx.beginPath(); ctx.arc(hx, ty + 9 * u + bob, 3.2 * u, 0, Math.PI * 2); ctx.fill();
      }
    }
    // Çatı
    ctx.fillStyle = '#d63b30'; ctx.fillRect(x0 - 10 * u, base - 120 * u, sw + 20 * u, 10 * u);
    ctx.fillStyle = '#fff'; for (let i = 0; i < 14; i++) if (i % 2) ctx.fillRect(x0 - 10 * u + i * (sw + 20 * u) / 14, base - 120 * u, (sw + 20 * u) / 14, 10 * u);
    ctx.fillStyle = '#8a8e98'; ctx.fillRect(x0, base - 110 * u, 4 * u, 20 * u); ctx.fillRect(x0 + sw - 4 * u, base - 110 * u, 4 * u, 20 * u);
    for (let i = 0; i < 5; i++) { ctx.fillStyle = ['#e8506a', '#ffd56b', '#4fb4e8', '#8fd86a', '#ffffff'][i]; const fx = x0 + 20 * u + i * 55 * u; ctx.fillRect(fx, base - 140 * u, 1.5 * u, 20 * u); ctx.beginPath(); ctx.moveTo(fx + 1.5 * u, base - 140 * u); ctx.lineTo(fx + 16 * u, base - 135 * u + Math.sin(performance.now() / 300 + i) * 2 * u); ctx.lineTo(fx + 1.5 * u, base - 130 * u); ctx.fill(); }
    // Işık direği
    const lx = x0 + sw + 40 * u;
    ctx.fillStyle = '#8a8e98'; ctx.fillRect(lx, base - 170 * u, 5 * u, 170 * u);
    ctx.fillStyle = '#5b5e66'; ctx.fillRect(lx - 14 * u, base - 182 * u, 33 * u, 14 * u);
    ctx.fillStyle = '#fff7cf'; for (let i = 0; i < 3; i++) ctx.fillRect(lx - 11 * u + i * 10 * u, base - 179 * u, 7 * u, 8 * u);
    // Reklam panosu
    const bx = x0 + sw + 70 * u, bw = 120 * u, bh = 34 * u;
    ctx.fillStyle = '#5b5e66'; ctx.fillRect(bx + 10 * u, base - 50 * u, 4 * u, 50 * u); ctx.fillRect(bx + bw - 14 * u, base - 50 * u, 4 * u, 50 * u);
    ctx.fillStyle = '#fffbe8'; ctx.fillRect(bx, base - 50 * u - bh, bw, bh);
    ctx.strokeStyle = '#2f7a4a'; ctx.lineWidth = Math.max(1, 2 * u); ctx.strokeRect(bx, base - 50 * u - bh, bw, bh);
    ctx.fillStyle = '#2f7a4a'; ctx.font = `bold ${Math.max(7, Math.round(10 * u))}px "Segoe UI", sans-serif`; ctx.textAlign = 'center';
    const txt = BILLBOARDS[((k % BILLBOARDS.length) + BILLBOARDS.length) % BILLBOARDS.length];
    ctx.fillText(txt, bx + bw / 2, base - 50 * u - bh / 2 + 4 * u, bw - 8 * u);
  }
  // Pist kenarı bariyeri ve lastik yığınları
  const sh2 = S.cam.x * 0.75 * u, bwid = 26 * u;
  for (let i = Math.floor(sh2 / bwid) - 1; i <= Math.floor((sh2 + W) / bwid) + 1; i++) {
    const x = i * bwid - sh2;
    ctx.fillStyle = (i % 2 + 2) % 2 ? '#f4f4f0' : '#d63b30'; ctx.fillRect(x, gl - 16 * u, bwid, 16 * u);
    if (((i % 9) + 9) % 9 === 0) {
      ctx.fillStyle = '#26262a';
      for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.ellipse(x + 13 * u, gl - 20 * u - j * 9 * u, 12 * u, 5 * u, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#4a4a50'; ctx.beginPath(); ctx.ellipse(x + 13 * u, gl - 38 * u, 6 * u, 2.4 * u, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(0, gl - 2 * u, W, 2 * u);
}

function drawCountry(th, gl, u) {
  if (th.track) { drawTrackBg(th, gl, u); return; }
  // Uzak ve yakın tepeler
  const hill = (color, par, hgt, f1, f2) => {
    const sh = S.cam.x * par * u;
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 16) ctx.lineTo(x, gl - hgt * u - Math.sin((x + sh) / (f1 * u)) * 28 * u - Math.sin((x + sh) / (f2 * u)) * 10 * u);
    ctx.lineTo(W, H); ctx.fill();
  };
  const gp = th.greening ? (S.deedsTotal ? S.deeds / S.deedsTotal : 0) : 1;
  hill(gp >= 1 ? '#a8d4a0' : mixColor('#d8c898', '#a8d4a0', gp), 0.12, 110, 210, 75);
  hill(gp >= 1 ? '#86c27a' : mixColor('#c4ae78', '#86c27a', gp), 0.25, 60, 160, 60);
  // Ağaçlar ve köy evleri
  const sh = S.cam.x * 0.45 * u, sp = 150 * u;
  for (let k = Math.floor(sh / sp) - 1; k <= Math.floor((sh + W) / sp) + 1; k++) {
    const x = k * sp - sh + (((k * 37) % 50) + 50) % 50 * u, kind = ((k % 5) + 5) % 5;
    if (kind === 2) {
      ctx.fillStyle = '#efe2c4'; ctx.fillRect(x, gl - 46 * u, 52 * u, 46 * u);
      ctx.fillStyle = '#b5543a'; ctx.beginPath(); ctx.moveTo(x - 6 * u, gl - 46 * u); ctx.lineTo(x + 26 * u, gl - 70 * u); ctx.lineTo(x + 58 * u, gl - 46 * u); ctx.fill();
      ctx.fillStyle = '#6b4220'; ctx.fillRect(x + 20 * u, gl - 24 * u, 12 * u, 24 * u);
      ctx.fillStyle = '#7da7c8'; ctx.fillRect(x + 6 * u, gl - 36 * u, 9 * u, 9 * u); ctx.fillRect(x + 37 * u, gl - 36 * u, 9 * u, 9 * u);
    } else {
      ctx.fillStyle = '#6b4a2e'; ctx.fillRect(x + 12 * u, gl - 34 * u, 6 * u, 34 * u);
      ctx.fillStyle = kind % 2 ? '#4f9a42' : '#3f8a4a';
      ctx.beginPath(); ctx.arc(x + 15 * u, gl - 44 * u, 18 * u, 0, Math.PI * 2); ctx.arc(x + 4 * u, gl - 34 * u, 12 * u, 0, Math.PI * 2); ctx.arc(x + 26 * u, gl - 34 * u, 12 * u, 0, Math.PI * 2); ctx.fill();
      if (kind === 1) { ctx.fillStyle = '#e8506a'; for (let i = 0; i < 4; i++) ctx.beginPath(), ctx.arc(x + (6 + i * 6) * u, gl - (40 - (i % 2) * 8) * u, 2.2 * u, 0, Math.PI * 2), ctx.fill(); }
    }
  }
}

function drawMosqueSilhouette(x, base, u, th) {
  // Ana kubbe, yarım kubbeler, iki minare ve aralarında mahya ışıkları
  const w = 260 * u;
  const cx = x + w / 2;
  ctx.fillRect(x + 40 * u, base - 70 * u, w - 80 * u, 110 * u);
  ctx.beginPath(); ctx.arc(cx, base - 70 * u, 62 * u, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - 3 * u, base - 152 * u, 6 * u, 22 * u);
  ctx.beginPath(); ctx.arc(cx - 70 * u, base - 50 * u, 30 * u, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 70 * u, base - 50 * u, 30 * u, Math.PI, 0); ctx.fill();
  const minaret = (mx) => {
    ctx.fillRect(mx - 6 * u, base - 210 * u, 12 * u, 250 * u);
    ctx.fillRect(mx - 10 * u, base - 160 * u, 20 * u, 6 * u);
    ctx.fillRect(mx - 10 * u, base - 190 * u, 20 * u, 5 * u);
    ctx.beginPath(); ctx.moveTo(mx - 7 * u, base - 210 * u); ctx.lineTo(mx, base - 250 * u); ctx.lineTo(mx + 7 * u, base - 210 * u); ctx.fill();
  };
  minaret(x + 10 * u); minaret(x + w - 10 * u);
  // Mahya (yalnızca gece)
  if (S.lv && THEMES[S.lv.theme].day) return;
  const save = ctx.fillStyle;
  const y0 = base - 186 * u;
  ctx.fillStyle = '#ffe9a0';
  const n = 22;
  for (let i = 1; i < n; i++) {
    const t = i / n;
    const px = lerp(x + 10 * u, x + w - 10 * u, t);
    const py = y0 + Math.sin(t * Math.PI) * 26 * u;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 500 + i);
    ctx.beginPath(); ctx.arc(px, py, Math.max(1, 1.6 * u), 0, Math.PI * 2); ctx.fill();
  }
  // Mahyada küçük hilal
  ctx.globalAlpha = 0.9;
  ctx.drawImage(moonCv, cx - 18 * u, y0 + 32 * u, 36 * u, 36 * u);
  ctx.fillStyle = save; ctx.globalAlpha = 1;
}

function drawTiles() {
  const x0 = Math.max(0, Math.floor(S.cam.x / T) - 1), x1 = Math.min(S.w - 1, Math.ceil((S.cam.x + viewW) / T) + 1);
  for (let ty = 0; ty < ROWS; ty++) for (let tx = x0; tx <= x1; tx++) {
    const c = S.grid[ty][tx];
    if (c === '.') continue;
    const x = tx * T, y = ty * T;
    const topOpen = !SOLID.has(tileAt(tx, ty - 1));
    if (c === '#') {
      ctx.fillStyle = topOpen ? '#9a7a55' : '#7b5f43';
      ctx.fillRect(x, y, T, T);
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      const off = (ty % 2) * 16;
      ctx.fillRect(x, y + 15, T, 2);
      ctx.fillRect(x + ((off + 8) % 32), y, 2, 15);
      ctx.fillRect(x + ((off + 24) % 32), y + 17, 2, 15);
      if (topOpen) { ctx.fillStyle = '#c9a874'; ctx.fillRect(x, y, T, 4); ctx.fillStyle = 'rgba(255,240,200,.25)'; ctx.fillRect(x, y, T, 1.5); }
    } else if (c === 'r') {
      if (topOpen) {
        ctx.fillStyle = '#44474f'; ctx.fillRect(x, y, T, T);
        ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(x + ((tx * 11) % 24), y + 20, 3, 2); ctx.fillRect(x + ((tx * 7) % 26), y + 27, 2, 2);
        // Kırmızı-beyaz pist kenarı
        ctx.fillStyle = (tx % 2) ? '#e8e8ea' : '#d63b30'; ctx.fillRect(x, y, T, 6);
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, y + 6, T, 1.5);
        // Kesik orta çizgi
        if (tx % 2 === 0) { ctx.fillStyle = '#f4f4f0'; ctx.fillRect(x + 4, y + 16, 24, 3); }
        // Boşluk kenarında sarı-siyah uyarı
        if (!SOLID.has(tileAt(tx + 1, ty)) || !SOLID.has(tileAt(tx - 1, ty))) {
          const ex = !SOLID.has(tileAt(tx + 1, ty)) ? x + T - 6 : x;
          for (let i = 0; i < 4; i++) { ctx.fillStyle = i % 2 ? '#1e1e1e' : '#f2c230'; ctx.fillRect(ex, y + i * 8, 6, 8); }
        }
      } else {
        ctx.fillStyle = '#5b5e66'; ctx.fillRect(x, y, T, T);
        ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x, y + 15, T, 2); ctx.fillRect(x + ((ty % 2) * 16 + 8) % 32, y, 2, 15);
      }
    } else if (c === '~') {
      ctx.fillStyle = '#6b4a2a'; ctx.beginPath(); ctx.ellipse(x + 16, y + 30, 17, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a6238'; ctx.beginPath(); ctx.ellipse(x + 13, y + 29, 9, 2.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + 20, y + 28, 4, 1.2);
    } else if (c === 'g') {
      ctx.fillStyle = '#6b4a2e'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = 'rgba(0,0,0,.15)';
      ctx.fillRect(x + ((tx * 7) % 22) + 3, y + 14, 4, 3); ctx.fillRect(x + ((tx * 13) % 20) + 6, y + 24, 3, 3);
      if (topOpen) {
        const gp = S.lv && S.lv.greening ? (S.deedsTotal ? S.deeds / S.deedsTotal : 0) : 1;
        ctx.fillStyle = gp >= 1 ? '#4f9a42' : mixColor('#a89058', '#4f9a42', gp); ctx.fillRect(x, y, T, 7);
        ctx.fillStyle = gp >= 1 ? '#6cc052' : mixColor('#c9b06a', '#6cc052', gp); ctx.fillRect(x, y, T, 3);
        if (S.lv && S.lv.greening && gp > 0.3 && (tx * 7 + ty * 3) % 5 < gp * 4) { ctx.fillStyle = ['#e8506a', '#ffd56b', '#b06ad8'][tx % 3]; ctx.beginPath(); ctx.arc(x + 8 + (tx * 5) % 16, y - 2, 2.4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#3f8a4a'; ctx.fillRect(x + 7.5 + (tx * 5) % 16, y - 1, 1.2, 4); }
        ctx.fillStyle = gp >= 1 ? '#4f9a42' : mixColor('#a89058', '#4f9a42', gp);
        for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x + 2 + i * 8, y + 7); ctx.lineTo(x + 5 + i * 8, y + 11); ctx.lineTo(x + 8 + i * 8, y + 7); ctx.fill(); }
      }
    } else if (c === 'n') {
      ctx.fillStyle = topOpen ? '#8a90a8' : '#6c7290'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = 'rgba(0,0,0,.16)';
      const off2 = (ty % 2) * 16;
      ctx.fillRect(x, y + 15, T, 2); ctx.fillRect(x + ((off2 + 8) % 32), y, 2, 15); ctx.fillRect(x + ((off2 + 24) % 32), y + 17, 2, 15);
      if (topOpen) {
        ctx.fillStyle = '#f4f8ff'; ctx.fillRect(x, y - 2, T, 7);
        ctx.beginPath(); ctx.arc(x + 7, y + 5, 3, 0, Math.PI); ctx.arc(x + 22, y + 5, 4, 0, Math.PI); ctx.fill();
        ctx.fillStyle = 'rgba(180,200,255,.5)'; ctx.fillRect(x, y + 3, T, 1.5);
      }
    } else if (c === 'b') {
      ctx.fillStyle = '#9c6a36'; ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
      ctx.strokeStyle = '#6b4320'; ctx.lineWidth = 3;
      ctx.strokeRect(x + 2.5, y + 2.5, T - 5, T - 5);
      ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + T - 4, y + T - 4); ctx.moveTo(x + T - 4, y + 4); ctx.lineTo(x + 4, y + T - 4); ctx.stroke();
    } else if (c === 't') {
      ctx.fillStyle = topOpen ? '#b5543a' : '#7a3f35';
      ctx.fillRect(x, y, T, T);
      if (topOpen) {
        ctx.fillStyle = '#c96a4a';
        for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + 4 + i * 8, y + 6, 4.5, 0, Math.PI); ctx.fill(); }
        ctx.fillStyle = '#8f3b28'; ctx.fillRect(x, y + 12, T, 2);
        ctx.fillStyle = '#c96a4a';
        for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + i * 8, y + 18, 4.5, 0, Math.PI); ctx.fill(); }
        ctx.fillStyle = '#8f3b28'; ctx.fillRect(x, y + 24, T, 2);
      } else {
        ctx.fillStyle = 'rgba(255,220,180,.07)';
        ctx.fillRect(x + 6, y + 8, 8, 12); ctx.fillRect(x + 19, y + 8, 8, 12);
      }
    } else if (c === '-') {
      // Çizgili tente
      for (let i = 0; i < 4; i++) { ctx.fillStyle = i % 2 ? '#f3e6c8' : '#c0392b'; ctx.fillRect(x + i * 8, y, 8, 9); }
      for (let i = 0; i < 4; i++) { ctx.fillStyle = i % 2 ? '#f3e6c8' : '#c0392b'; ctx.beginPath(); ctx.arc(x + 4 + i * 8, y + 9, 4, 0, Math.PI); ctx.fill(); }
      ctx.fillStyle = '#5a3a1e'; ctx.fillRect(x, y - 2, T, 3);
    } else if (c === '^') {
      ctx.fillStyle = '#2f6b3a';
      ctx.beginPath(); ctx.arc(x + 16, y + 32, 15, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#3f8a4a';
      ctx.beginPath(); ctx.arc(x + 12, y + 30, 8, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = '#d9d2a8'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let i = 0; i < 7; i++) {
        const a = Math.PI + (i + 0.5) * Math.PI / 7;
        const bx = x + 16 + Math.cos(a) * 14, by = y + 32 + Math.sin(a) * 14;
        ctx.moveTo(bx, by); ctx.lineTo(x + 16 + Math.cos(a) * 20, y + 32 + Math.sin(a) * 20);
      }
      ctx.stroke();
    }
  }
}

function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(255,200,90,0)');
  ctx.globalAlpha = a; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawEnts() {
  const t = S.time;
  const vis = (x) => x > S.cam.x - 200 && x < S.cam.x + viewW + 200;
  for (const e of S.ents) {
    const ex = e.x != null ? e.x : e.ax;
    if (!vis(e.k === 'pot' ? e.ax : ex)) continue;
    switch (e.k) {
      case 'date': {
        if (e.got) break;
        if (S.lv.trash) { drawTrash(e); break; }
        const y = e.y + Math.sin(t * 3 + e.ph) * 3;
        ctx.save(); ctx.translate(e.x, y); ctx.rotate(-0.35);
        ctx.fillStyle = '#5a2a12'; ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 9.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8a4a22'; ctx.beginPath(); ctx.ellipse(-1.5, -1, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,220,180,.6)'; ctx.beginPath(); ctx.ellipse(-2.5, -4, 1.5, 3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        break;
      }
      case 'light': {
        if (e.got) break;
        const y = e.y + Math.sin(t * 2.5 + e.ph) * 4;
        glow(e.x, y, 34, 'rgba(255,233,160,.9)', 0.6 + 0.2 * Math.sin(t * 4 + e.ph));
        ctx.fillStyle = '#fff8d8'; ctx.beginPath(); ctx.arc(e.x, y, 7, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff2b0'; ctx.lineWidth = 2;
        const s = 11 + Math.sin(t * 5 + e.ph) * 2;
        ctx.beginPath(); ctx.moveTo(e.x - s, y); ctx.lineTo(e.x + s, y); ctx.moveTo(e.x, y - s); ctx.lineTo(e.x, y + s); ctx.stroke();
        break;
      }
      case 'flag': drawCheckpoint(e); break;
      case 'end': drawFountain(e); break;
      case 'item': if (!e.used) drawItem(e.item, e.x, e.y, e.held); break;
      case 'recv': drawReceiver(e); break;
      case 'spawner': drawBarrelStack(e); break;
      case 'pot': drawPot(e); break;
      case 'bee': drawBee(e); break;
      case 'mplat': drawMPlat(e); break;

function drawFountain(e) {
  if (S.race) { drawGrandHouse(e); return; }
  if (S.lv.kite) { drawKiteField(e); return; }
  if (S.lv.greening) { drawHillTop(e); return; }
  // Cami avlusu kapısı + şadırvan
  const x = e.x, base = e.y + T;
  // Kapı kemeri (arka)
  ctx.fillStyle = '#5f4a6e'; ctx.fillRect(x + 50, base - 130, 90, 130);
  ctx.fillStyle = '#2a1f3a';
  ctx.beginPath(); ctx.moveTo(x + 66, base); ctx.lineTo(x + 66, base - 70);
  ctx.quadraticCurveTo(x + 66, base - 108, x + 95, base - 116); ctx.quadraticCurveTo(x + 124, base - 108, x + 124, base - 70);
  ctx.lineTo(x + 124, base); ctx.fill();
  glow(x + 95, base - 60, 60, 'rgba(255,214,110,.7)', 0.35);
  ctx.fillStyle = '#7a6290'; ctx.fillRect(x + 46, base - 136, 98, 8);
  // Şadırvan
  const cx = x + 16;
  ctx.fillStyle = '#c9b89a'; ctx.fillRect(cx - 34, base - 18, 68, 18);
  ctx.fillStyle = '#a8957a'; ctx.fillRect(cx - 34, base - 18, 68, 4);
  ctx.fillStyle = '#6fb7d9'; ctx.fillRect(cx - 30, base - 14, 60, 3);
  ctx.fillStyle = '#d8c7a8';
  for (const px of [-28, -10, 8, 24]) ctx.fillRect(cx + px, base - 64, 4, 46);
  ctx.fillStyle = '#4d7a8f';
  ctx.beginPath(); ctx.moveTo(cx - 40, base - 64); ctx.lineTo(cx + 40, base - 64); ctx.lineTo(cx + 28, base - 74); ctx.lineTo(cx - 28, base - 74); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, base - 74, 24, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#ffd56b'; ctx.fillRect(cx - 1.5, base - 108, 3, 12);
  ctx.beginPath(); ctx.arc(cx, base - 110, 4, 0, Math.PI * 2); ctx.fill();
  // Su damlaları
  ctx.fillStyle = '#9fe0ff';
  for (let i = 0; i < 6; i++) {
    const k = ((S.time * 1.4 + i / 6) % 1);
    ctx.globalAlpha = 1 - k;
    ctx.fillRect(cx - 20 + i * 8, base - 40 + k * 22, 2, 4);
  }
  ctx.globalAlpha = 1;
  glow(cx, base - 40, 70, 'rgba(255,230,150,.6)', 0.25 + 0.08 * Math.sin(S.time * 3));
}

    for (const [fx, fy, fc] of [[-4, -13, '#e8506a'], [0, -16, '#ffd56b'], [4, -13, '#b06ad8']]) {
      ctx.fillStyle = fc; ctx.beginPath(); ctx.arc(fx, fy, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(fx, fy, 1.1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#f3e6c8'; ctx.beginPath(); ctx.moveTo(-5, -4); ctx.lineTo(5, -4); ctx.lineTo(2, 1); ctx.lineTo(-2, 1); ctx.fill();
  } else if (kind === 'seker') {
    ctx.fillStyle = '#e8eef6'; ctx.beginPath(); ctx.ellipse(0, -4, 12, 3.5, 0, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 5; i++) { ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.ellipse(-7 + i * 3.5, -7 - (i % 2) * 2, 2.6, 1.8, 0.4, 0, Math.PI * 2); ctx.fill(); }
  } else if (kind === 'kedicik') {

    ctx.fillStyle = '#2a2a3a'; ctx.fillRect(1.5, -14, 1.4, 1.4); ctx.fillRect(4.5, -14, 1.4, 1.4);
