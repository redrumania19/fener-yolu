}

function drawReceiver(e) {
  const x = e.x, b = e.y, t = S.time;
  if (e.who === 'kedi') {
    // Oturan kedi + tas
    ctx.fillStyle = '#e08a3c';
    ctx.beginPath(); ctx.ellipse(x - 4, b - 11, 10, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 2, b - 26, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 9, b - 30); ctx.lineTo(x - 7, b - 39); ctx.lineTo(x - 3, b - 32); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 5, b - 30); ctx.lineTo(x + 4, b - 39); ctx.lineTo(x - 1, b - 32); ctx.fill();
    ctx.strokeStyle = '#e08a3c'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 13, b - 4); ctx.quadraticCurveTo(x - 24, b - 10 + Math.sin(t * 3) * 3, x - 20, b - 22); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = '#b8652a'; ctx.fillRect(x - 8, b - 16, 3, 6); ctx.fillRect(x - 1, b - 17, 3, 6);
    ctx.fillStyle = '#2a1a0a';
    if (e.done) { ctx.fillRect(x - 6, b - 27, 3, 1.5); ctx.fillRect(x + 0, b - 27, 3, 1.5); }
    else { ctx.beginPath(); ctx.arc(x - 5, b - 27, 1.4, 0, Math.PI * 2); ctx.arc(x + 1.5, b - 27, 1.4, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#f2a0a8'; ctx.beginPath(); ctx.arc(x - 1.8, b - 23.5, 1.3, 0, Math.PI * 2); ctx.fill();
    // Tas
    ctx.fillStyle = '#b87333'; ctx.beginPath(); ctx.ellipse(x + 14, b - 3, 8, 4, 0, 0, Math.PI); ctx.fill(); ctx.fillRect(x + 6, b - 6, 16, 3);
    if (e.done) { ctx.fillStyle = '#7fd0ff'; ctx.fillRect(x + 7, b - 6.5, 14, 2); }
    if (!e.done) drawBubble(x + 6, b - 50, 'drop');
  } else if (e.who === 'yuva') {
    // Dal + yuva
    ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x - 26, b + 2); ctx.lineTo(x + 26, b - 4); ctx.stroke();
    ctx.fillStyle = '#3f8a4a'; ctx.beginPath(); ctx.ellipse(x + 26, b - 8, 8, 5, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7a5530'; ctx.beginPath(); ctx.ellipse(x, b - 6, 15, 8, 0, 0, Math.PI); ctx.fill();
    ctx.fillRect(x - 15, b - 9, 30, 4);
    ctx.strokeStyle = '#a07a48'; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x - 13 + i * 6, b - 8); ctx.lineTo(x - 9 + i * 6, b - 2); ctx.stroke(); }
    if (e.done) {
      drawItem('yavru', x, b - 2, true);
      // Anne kuş gelir
      const k = Math.min(1, e.t / 1.2);
      const mx = lerp(x + 120, x + 22, k), my = lerp(b - 90, b - 24, k);
      ctx.fillStyle = '#8a6a4a'; ctx.beginPath(); ctx.ellipse(mx, my, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx - 7, my - 4, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f08a24'; ctx.beginPath(); ctx.moveTo(mx - 11, my - 5); ctx.lineTo(mx - 15, my - 3.5); ctx.lineTo(mx - 11, my - 2); ctx.fill();
      ctx.fillStyle = '#6a4a2a'; ctx.beginPath(); ctx.ellipse(mx + 2, my - 3 + Math.sin(t * 18) * (k < 1 ? 3 : 0.5), 6, 3, -0.3, 0, Math.PI * 2); ctx.fill();
    } else drawBubble(x, b - 44, 'chick');
  } else if (e.who === 'guvercin') {
    for (let i = 0; i < 3; i++) {
      const gx = x - 20 + i * 18, peck = e.done ? Math.max(0, Math.sin(t * 7 + i * 2)) * 4 : 0;
      ctx.fillStyle = '#8f96a8'; ctx.beginPath(); ctx.ellipse(gx, b - 8, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6f7690'; ctx.beginPath(); ctx.ellipse(gx + 2, b - 9, 6, 4, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8f96a8'; ctx.beginPath(); ctx.arc(gx - 7, b - 15 + peck, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5fa88a'; ctx.fillRect(gx - 9, b - 12 + peck, 5, 2);
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(gx - 8.5, b - 16 + peck, 1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d98a8a'; ctx.fillRect(gx - 13, b - 15 + peck, 3, 1.5);
      ctx.fillStyle = '#d98a8a'; ctx.fillRect(gx - 2, b - 2, 1.5, 2); ctx.fillRect(gx + 2, b - 2, 1.5, 2);
    }
    if (e.done) { ctx.fillStyle = '#c9a86a'; for (let i = 0; i < 14; i++) ctx.fillRect(x - 32 + (i * 37 % 60), b - 2 - (i % 3), 2, 2); }
    else drawBubble(x, b - 42, 'seed');
  }
  if (e.who === 'komsu' || e.who === 'komsu2') {

    ctx.fillStyle = '#a8553a'; ctx.beginPath(); ctx.moveTo(x - 36, b - 74); ctx.lineTo(x, b - 96); ctx.lineTo(x + 36, b - 74); ctx.fill();
    ctx.fillStyle = '#6b4220';
    ctx.beginPath(); ctx.moveTo(x - 11, b); ctx.lineTo(x - 11, b - 30); ctx.quadraticCurveTo(x - 11, b - 42, x, b - 44); ctx.quadraticCurveTo(x + 11, b - 42, x + 11, b - 30); ctx.lineTo(x + 11, b); ctx.fill();
    ctx.fillStyle = '#e8c76a'; ctx.beginPath(); ctx.arc(x + 6, b - 20, 1.6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = lit ? '#ffd56b' : '#3a3150'; ctx.fillRect(x + 14, b - 62, 12, 14); ctx.fillRect(x - 26, b - 62, 12, 14);
    ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = 1.5; ctx.strokeRect(x + 14, b - 62, 12, 14); ctx.strokeRect(x - 26, b - 62, 12, 14);
    ctx.fillStyle = '#b8a88a'; ctx.fillRect(x - 14, b - 3, 28, 3);
    if (e.who === 'komsu2') {
      if (e.done) drawItem('cicek', x - 18, b - 2, true);
      else drawBubble(x, b - 58, 'flower');
    } else if (e.done) drawItem('pide', x - 18, b - 2, true);
    else drawBubble(x, b - 58, 'bread');
  } else if (e.who === 'cukur') {
    if (!e.done) {
      ctx.fillStyle = '#5a3a1e'; ctx.beginPath(); ctx.ellipse(x, b - 2, 15, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a2412'; ctx.beginPath(); ctx.ellipse(x, b - 1, 10, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a6a3a'; ctx.fillRect(x + 14, b - 26, 3, 26); ctx.fillStyle = '#e8dcc0'; ctx.fillRect(x + 6, b - 30, 20, 10);
      ctx.fillStyle = '#3f8a4a'; ctx.font = 'bold 6px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('FİDAN', x + 16, b - 23);
      drawBubble(x, b - 40, 'sapling');
    } else {
      const g = Math.min(1, e.t / 1.5);
      ctx.fillStyle = '#5a3a1e'; ctx.beginPath(); ctx.ellipse(x, b - 1, 14, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6b4a2e'; ctx.fillRect(x - 3, b - 30 * g - 4, 6, 30 * g + 4);
      ctx.fillStyle = '#3f8a4a';
      for (const [dx, dy, rr0] of [[0, -38, 16], [-12, -28, 11], [12, -28, 11]]) { ctx.beginPath(); ctx.arc(x + dx * g, b + dy * g, rr0 * g + 2, 0, Math.PI * 2); ctx.fill(); }
      if (g >= 1) { ctx.fillStyle = '#e8506a'; for (const [dx, dy] of [[-6, -40], [7, -33], [-10, -27]]) { ctx.beginPath(); ctx.arc(x + dx, b + dy, 2.4, 0, Math.PI * 2); ctx.fill(); } }
    }
  } else if (e.who === 'cocuklar') {
    // İki küçük komşu çocuğu (sıradan çocuklar)
    const kids = [{ dx: -11, shirt: '#e8506a', hair: '#3a2410', h: 30 }, { dx: 11, shirt: '#4f9ad8', hair: '#5a3a1a', h: 26 }];
    for (const k of kids) {
      const kx = x + k.dx, hop = e.done ? Math.abs(Math.sin(S.time * 6 + k.dx)) * 4 : 0, top = b - k.h - hop;
      ctx.fillStyle = '#2f3a5a'; ctx.fillRect(kx - 4, b - 9 - hop, 3, 9); ctx.fillRect(kx + 1, b - 9 - hop, 3, 9);

      ctx.fillStyle = '#2a1a0a'; ctx.fillRect(kx - 2.5, top + 5, 1.3, 1.3); ctx.fillRect(kx + 1.5, top + 5, 1.3, 1.3);
      ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.arc(kx, top + 7, 1.6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      ctx.strokeStyle = '#f2c9a0'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      const wave = e.done ? Math.sin(S.time * 8 + k.dx) * 3 : 0;
      ctx.beginPath(); ctx.moveTo(kx + 6, top + 12); ctx.lineTo(kx + 9, top + (e.done ? 2 + wave : 18)); ctx.stroke(); ctx.lineCap = 'butt';
    }
    if (!e.done) drawBubble(x, b - 48, 'candy');
    else drawItem('seker', x, b + 2, true);
  } else if (e.who === 'yavrukedi') {
    if (!e.done) {
      const sh = Math.sin(S.time * 45) * 0.8;
      ctx.fillStyle = '#9aa0ae';
      ctx.beginPath(); ctx.ellipse(x + sh, b - 7, 7, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 2 + sh, b - 16, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 2 + sh, b - 19); ctx.lineTo(x - 1 + sh, b - 25); ctx.lineTo(x + 2 + sh, b - 21); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 6 + sh, b - 19); ctx.lineTo(x + 6 + sh, b - 25); ctx.lineTo(x + 3 + sh, b - 21); ctx.fill();
      ctx.fillStyle = '#2a2a3a'; ctx.fillRect(x + 0 + sh, b - 17, 1.6, 1.6); ctx.fillRect(x + 4 + sh, b - 17, 1.6, 1.6);

      ctx.fillStyle = '#2a2a3a'; ctx.fillRect(x - 2, b - 16, 2.5, 1); ctx.fillRect(x + 2.5, b - 16, 2.5, 1);
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.time * 2); ctx.fillStyle = '#e8eeff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('z', x + 10, b - 24 - (S.time * 6 % 8)); ctx.globalAlpha = 1;

function drawPlayerLantern() {
  const p = S.p;
  if (S.mode === 'dying') {
    const k = 1 - S.dieT / 0.75;
    ctx.globalAlpha = 1 - k;
  } else if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0) ctx.globalAlpha = 0.35;
  const cx = p.x + p.w / 2, base = p.y + p.h;
  glow(cx, p.y + 12, 90, 'rgba(255,214,110,.75)', 0.32);
  ctx.save();
  ctx.translate(cx, base);
  const sq = p.squash;
  ctx.scale(1 + sq * 0.6, 1 - sq * 0.6);
  // Bacaklar
  const st = Math.sin(p.walkT * 2.2);
  ctx.strokeStyle = '#6b4a1a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  const lift = p.onGround ? 0 : 2;
  ctx.beginPath();
  ctx.moveTo(-5, -5); ctx.lineTo(-5 + st * 3, -1 - lift - Math.max(0, st) * 2);
  ctx.moveTo(5, -5); ctx.lineTo(5 - st * 3, -1 - lift - Math.max(0, -st) * 2);
  ctx.stroke(); ctx.lineCap = 'butt';
  // Taban
  ctx.fillStyle = '#b8862b'; ctx.fillRect(-11, -8, 22, 4);
  ctx.fillStyle = '#8a6018'; ctx.fillRect(-9, -5, 18, 1.5);
  // Cam gövde
  const g = ctx.createLinearGradient(0, -24, 0, -8);
  g.addColorStop(0, '#fff3c0'); g.addColorStop(1, '#ffc24a');
  ctx.fillStyle = g; ctx.fillRect(-10, -24, 20, 16);
  // Alev parıltısı
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(-8, -22, 3, 11);
  // Çerçeve
  ctx.strokeStyle = '#b8862b'; ctx.lineWidth = 2;
  ctx.strokeRect(-10, -24, 20, 16);
  // Gözler
  const lx = p.face * 2;
  ctx.fillStyle = '#3a2410';
  if (p.blinkT < 0 || S.mode === 'dying') { ctx.fillRect(-6 + lx, -17, 4, 1.5); ctx.fillRect(2 + lx, -17, 4, 1.5); }
  else {
    ctx.beginPath(); ctx.ellipse(-4 + lx, -17, 1.8, 2.6, 0, 0, Math.PI * 2); ctx.ellipse(4 + lx, -17, 1.8, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-4 + lx, -18.5, 1, 1); ctx.fillRect(4 + lx, -18.5, 1, 1);
  }
  // Yanaklar ve gülümseme
  ctx.fillStyle = 'rgba(240,120,90,.45)'; ctx.beginPath(); ctx.arc(-7 + lx, -13, 1.8, 0, Math.PI * 2); ctx.arc(7 + lx, -13, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(lx, -14, 2.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  // Şapka (kubbe biçimli kapak)
  ctx.fillStyle = '#c9952e';
  ctx.beginPath(); ctx.moveTo(-12, -24); ctx.lineTo(12, -24); ctx.lineTo(7, -29); ctx.lineTo(-7, -29); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -29, 6, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#c9952e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -37, 3.5, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

const HERO = { img: new Image(), ok: false, meta: window.HERO_META || null };
HERO.img.onload = () => { HERO.ok = !!HERO.meta; };
if (window.HERO_SRC) HERO.img.src = window.HERO_SRC;
const HERO_DH = 52;   // çizim yüksekliği (dünya birimi)

function drawHeldLantern(x, y, sw) {
  glow(x, y + 4, 80, 'rgba(255,214,110,.8)', 0.38);
  ctx.save(); ctx.translate(x, y); ctx.rotate(sw);
  ctx.strokeStyle = '#6b4a1a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, -1); ctx.stroke();
  ctx.fillStyle = '#c9952e';
  ctx.beginPath(); ctx.arc(0, 1, 4, Math.PI, 0); ctx.fill();
  ctx.fillRect(-4.5, 1, 9, 2);
  const g = ctx.createLinearGradient(0, 3, 0, 12);
  g.addColorStop(0, '#fff3c0'); g.addColorStop(1, '#ffc24a');
  ctx.fillStyle = g; ctx.fillRect(-3.5, 3, 7, 9);
  ctx.strokeStyle = '#a8761e'; ctx.lineWidth = 1; ctx.strokeRect(-3.5, 3, 7, 9);
  ctx.fillStyle = '#c9952e'; ctx.fillRect(-4.5, 12, 9, 2);

}

function drawPlayer() {
  if (S.race) { drawCar(); return; }
  if (S.lv && S.lv.kite) { drawKiteKerem(); return; }
  if (!HERO.ok) { drawPlayerLantern(); return; }
  const p = S.p;
  if (S.mode === 'dying') ctx.globalAlpha = Math.max(0, S.dieT / 0.75);
  else if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0) ctx.globalAlpha = 0.35;
  const cx = p.x + p.w / 2, base = p.y + p.h;
  const F = HERO.meta.frames;
  const moving = p.onGround && Math.abs(p.vx) > 10;
  const fi = (S.mode === 'complete' && F[6]) ? 6 : !p.onGround ? 5 : moving ? 1 + (Math.floor(p.walkT * 0.75) % 4) : 0;
  const f = F[fi];
  const k = HERO_DH / HERO.meta.h;
  const bob = moving ? -Math.abs(Math.sin(p.walkT * 1.2)) * 1.6 : Math.sin(S.time * 2.2) * 0.5;
  ctx.save();
  ctx.translate(cx, base + bob);
  const sq = p.squash;
  ctx.scale(1 + sq * 0.5, 1 - sq * 0.5);
  if (p.spin > 0) {   // ikinci zıplamada takla
    ctx.translate(0, -HERO_DH / 2); ctx.rotate(p.face * (1 - p.spin) * Math.PI * 2); ctx.translate(0, HERO_DH / 2);
  }
  ctx.scale(-p.face, 1);   // Kling karelerinde çocuk sola bakıyor; yürüme yönüne çevir
  if (moving) ctx.rotate(Math.sin(p.walkT * 1.2) * 0.06);
  else if (!p.onGround) ctx.rotate(-0.08);
  ctx.drawImage(HERO.img, f.x, f.y, f.w, f.h, -f.w * k / 2, -f.h * k, f.w * k, f.h * k);
  ctx.restore();
  // Elindeki fener
  const sw = Math.sin(S.time * 3 + p.walkT) * 0.25 - p.vx / RUN * 0.3;
  const lx = cx + p.face * 14, ly = base - (p.onGround ? 24 : 29) + bob;
  drawHeldLantern(lx, ly, sw);
  ctx.globalAlpha = 1;
}

function drawParts() {
  for (const q of S.parts) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - q.r / 2, q.y - q.r / 2, q.r, q.r);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = 'bold 14px "Segoe UI", sans-serif';
  for (const f of S.floats) {
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.fillStyle = '#000'; ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = '#fff3c0'; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

const SPR = {};
function mkCv(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function spr(key) {
  if (SPR[key]) return SPR[key];

      g.fillStyle = '#56a85a'; g.beginPath(); g.arc(62, 55, 26, 0, Math.PI * 2); g.fill();
      if (arg === '1') { g.fillStyle = '#e8506a'; for (const [x, y] of [[50, 90], [100, 70], [120, 115], [70, 125], [95, 100]]) { g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); g.fill(); } }
    }); break;
    case 'stand': c = mkCv(420, 230, (g) => {
      const r = rand(77);
      for (let t = 0; t < 3; t++) {
        const y = 200 - (t + 1) * 48;
        g.fillStyle = t % 2 ? '#c3c8d2' : '#d4d8e0'; g.fillRect(10 + t * 16, y, 400 - t * 32, 48);
        g.fillStyle = 'rgba(0,0,0,.1)'; g.fillRect(10 + t * 16, y + 42, 400 - t * 32, 6);
        for (let i = 0; i < 20 - t * 2; i++) {
          const hx = 26 + t * 16 + i * ((368 - t * 32) / (19 - t * 2));
          g.fillStyle = ['#e8506a', '#4fb4e8', '#ffd56b', '#8fd86a', '#b06ad8', '#f39a4a'][Math.floor(r() * 6)];
          g.fillRect(hx - 6, y + 18, 12, 18);
          g.fillStyle = '#f2c9a0'; g.beginPath(); g.arc(hx, y + 13, 6, 0, Math.PI * 2); g.fill();
        }
      }
      g.fillStyle = '#d63b30'; g.fillRect(0, 26, 420, 16);
      g.fillStyle = '#fff'; for (let i = 0; i < 14; i++) if (i % 2) g.fillRect(i * 30, 26, 30, 16);
      g.fillStyle = '#8a8e98'; g.fillRect(12, 42, 6, 20); g.fillRect(402, 42, 6, 20);
      g.fillStyle = '#9aa0aa'; g.fillRect(0, 200, 420, 30);
      for (let i = 0; i < 5; i++) { g.fillStyle = ['#e8506a', '#ffd56b', '#4fb4e8', '#8fd86a', '#ffffff'][i]; const fx = 40 + i * 85; g.fillRect(fx, 0, 3, 28); g.beginPath(); g.moveTo(fx + 3, 2); g.lineTo(fx + 28, 9); g.lineTo(fx + 3, 16); g.fill(); }
    }); break;
    case 'bb': c = mkCv(340, 190, (g) => {
      g.fillStyle = '#5b5e66'; g.fillRect(40, 100, 10, 90); g.fillRect(290, 100, 10, 90);
      g.fillStyle = '#fffbe8'; g.fillRect(4, 4, 332, 100);
      g.strokeStyle = '#2f7a4a'; g.lineWidth = 8; g.strokeRect(4, 4, 332, 100);
      g.fillStyle = '#2f7a4a'; g.font = 'bold 30px "Segoe UI", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(BILLBOARDS[+arg % BILLBOARDS.length], 170, 56, 310);
    }); break;
    case 'lamp': c = mkCv(90, 420, (g) => {
      g.fillStyle = '#8a8e98'; g.fillRect(40, 30, 10, 390);
      g.fillStyle = '#5b5e66'; g.fillRect(4, 0, 82, 34);
      g.fillStyle = '#fff7cf'; for (let i = 0; i < 3; i++) g.fillRect(10 + i * 26, 6, 20, 22);
    }); break;
    case 'tire': c = mkCv(130, 120, (g) => {
      for (let j = 0; j < 3; j++) { g.fillStyle = '#26262a'; g.beginPath(); g.ellipse(65, 100 - j * 30, 60, 22, 0, 0, Math.PI * 2); g.fill(); g.fillStyle = j === 2 ? '#4a4a50' : '#1a1a1e'; g.beginPath(); g.ellipse(65, 96 - j * 30, 26, 8, 0, 0, Math.PI * 2); g.fill(); }
    }); break;

// --- Pist kurulumu ---
function build3DTrack() {
  const SEG = R3.SEG, segs = [];
  let y = 0;
  const add = (curve, yEnd) => { const n = segs.length; segs.push({ i: n, p1y: y, p2y: yEnd, curve, objs: [], deco: [], c: Math.floor(n / 3) % 2 }); y = yEnd; };
  const ease = (t) => (-Math.cos(t * Math.PI) / 2) + 0.5;
  const road = (enter, hold, leave, curve, hill) => {
    const y0 = y, tot = enter + hold + leave; let k = 0;
    for (let i = 0; i < enter; i++) add(curve * (i / enter), y0 + hill * ease(++k / tot));
    for (let i = 0; i < hold; i++) add(curve, y0 + hill * ease(++k / tot));
    for (let i = 0; i < leave; i++) add(curve * (1 - i / leave), y0 + hill * ease(++k / tot));
  };
  const snow = S.lv && S.lv.r3v === 'snow';
  if (snow) {
    // Karlı dağ: çoğu yokuş aşağı, kıvrımlı
    road(0, 60, 0, 0, 0);
    road(25, 40, 25, -2, -1500);
    road(20, 30, 20, 3, -900);
    road(20, 30, 20, -3, -900);
    road(30, 40, 30, 0, 1200);
    road(25, 50, 25, 4, -2400);
    road(0, 50, 0, 0, 0);
    road(20, 40, 20, -4, -1200);
    road(20, 30, 20, 2, 600);
    road(25, 40, 25, -2, -1800);
    road(20, 40, 20, 3, -600);
    road(30, 40, 30, 0, 1500);
    road(25, 40, 25, -3, -1500);
    road(25, 40, 25, 2, 900);
    road(20, 30, 20, -2, 0);
    road(0, 170, 0, 0, 0);
  } else {
  road(0, 60, 0, 0, 0);
  road(25, 50, 25, 2, 0);
  road(30, 40, 30, 0, 1800);
  road(25, 40, 25, -3, 0);
  road(30, 40, 30, 0, -1800);
  road(20, 30, 20, 3, 600);
  road(20, 30, 20, -3, -600);
  road(0, 60, 0, 0, 0);
  road(30, 60, 30, -2, 1200);
  road(30, 50, 30, 4, -1200);
  road(20, 40, 20, 0, 2400);
  road(20, 40, 20, 0, -2400);
  road(25, 40, 25, -4, 0);
  road(25, 40, 25, 2, 600);
  road(0, 170, 0, 0, 0);
  }
  const N = segs.length, finishIdx = N - 70;
  const put = (i, o) => { if (segs[i]) segs[i].objs.push(Object.assign({ z: i * SEG + SEG / 2, x: 0, h: 0 }, o)); };
  const deco = (i, o) => { if (segs[i]) segs[i].deco.push(Object.assign({ x: 0, h: 0 }, o)); };
  // Başlangıç ve bitiş çizgileri
  for (const i of [6, 7, finishIdx, finishIdx + 1]) segs[i].checker = true;
  deco(9, { key: 'arch:BAŞLANGIÇ', ww: 5400 });
  deco(finishIdx + 2, { key: 'arch:BİTİŞ', ww: 5400 });
  deco(N - 12, { key: snow ? 'soup' : 'house', ww: 4200 });
  // Yol kenarı süsleri
  const r = rand(2024);
  for (let i = 12; i < N - 14; i++) {
    const side = (i % 2) ? 1 : -1;
    if (snow) {
      if (i % 45 === 0) deco(i, { key: 'chalet', ww: 3200, x: side * 3.0 });
      else if (i % 60 === 11) deco(i, { key: 'snowman', ww: 700, x: -side * 1.7 });
      if (i % 5 === 0) deco(i, { key: 'pine', ww: 900, x: side * (1.6 + r() * 1.2) });
      if (i % 11 === 4) deco(i, { key: 'pine', ww: 1100, x: -side * (2.2 + r() * 1.4) });
      if (Math.abs(segs[i].curve) > 1.5 && i % 9 === 0) deco(i, { key: 'snowpile', ww: 600, x: segs[i].curve > 0 ? -1.3 : 1.3 });
      continue;
    }
    if (i % 40 === 0) deco(i, { key: 'stand', ww: 3800, x: side * 3.1 });
    else if (i % 55 === 7) deco(i, { key: 'bb:' + (Math.floor(i / 55) % 6), ww: 1700, x: -side * 2.1 });
    if (i % 24 === 3) { deco(i, { key: 'lamp', ww: 260, x: -1.28 }); deco(i, { key: 'lamp', ww: 260, x: 1.28 }); }
    if (i % 7 === 0 && i % 40 !== 0) deco(i, { key: 'tree:' + (r() < 0.3 ? 1 : 0), ww: 900, x: side * (1.7 + r() * 0.9) });
    if (Math.abs(segs[i].curve) > 1.5 && i % 9 === 0) deco(i, { key: 'tire', ww: 520, x: segs[i].curve > 0 ? -1.3 : 1.3 });
  }
  // Kontrol noktası fenerleri
  for (const i of [300, 600, 900, 1150]) put(i, { kind: 'flag', x: -1.35, ww: 380 });
  // Oyun nesneleri
  const L = [-0.6, 0, 0.6];
  let dates = 0, bad = 0;
  const lineOf = (i, lane, h = 0) => { for (let k = 0; k < 5; k++) { put(i + k * 4, { kind: 'date', x: L[lane], h, ww: 230 }); dates++; } };
  const cloud = (i, lane) => { put(i, { kind: 'bad', x: L[lane], ww: 760, label: BAD_TRAITS[bad++ % BAD_TRAITS.length] }); };
  const goodSegs = [[140, 2, 0], [270, 0, 0], [410, 1, 450], [540, 2, 0], [700, 0, 0], [860, 1, 450], [1010, 2, 0], [1160, 0, 0]];
  goodSegs.forEach(([i, lane, h], k) => put(i, { kind: 'good', x: L[lane], h, ww: 520, label: GOOD_TRAITS[k % GOOD_TRAITS.length] }));
  put(480, { kind: 'light', x: 0, h: 820, ww: 380 });
  put(1080, { kind: 'light', x: -0.6, h: 820, ww: 380 });
  const cids = (S.lv && S.lv.cardIds) || ['c13', 'c14'];
  put(640, { kind: 'card', id: cids[0], x: 0.6, h: 700, ww: 340 });
  put(1230, { kind: 'card', id: cids[1], x: -0.6, h: 700, ww: 340 });
  const bar = (i, lane) => { put(i, { kind: 'bar', x: L[lane], ww: 980, label: BAD_TRAITS[bad++ % BAD_TRAITS.length] }); };
  const pattern = ['dates', 'bad1', 'bar', 'mud', 'bad2', 'datesHigh', 'bar2', 'bad3', 'dates', 'bad2'];
  let pi = 0;
  for (let i = 90; i < finishIdx - 60; i += 42) {
    const p = pattern[pi++ % pattern.length], lane = Math.floor(r() * 3);
    if (p === 'dates') lineOf(i, lane);
    else if (p === 'datesHigh') lineOf(i, lane, 420);
    else if (p === 'mud') put(i, { kind: 'mud', x: L[lane], ww: 1000 });
    else if (p === 'bad1') cloud(i, lane);
    else if (p === 'bar') { bar(i, lane); lineOf(i + 3, lane); }
    else if (p === 'bar2') { bar(i, lane); bar(i, (lane + 1) % 3); lineOf(i - 8, (lane + 2) % 3); }
    else if (p === 'bad2') { cloud(i, lane); cloud(i + 18, (lane + 1 + Math.floor(r() * 2)) % 3); }
    else if (p === 'bad3') { const d = r() < 0.5 ? 1 : -1; cloud(i, d > 0 ? 0 : 2); cloud(i + 16, 1); cloud(i + 32, d > 0 ? 2 : 0); }

}

function setup3D() {
  const tr = build3DTrack();
  S.ents = []; S.barrels = [];
  S.r3 = {
    segs: tr.segs, N: tr.N, finishZ: tr.finishZ,
    pos: 0, speed: 0, x: 0, y: 0, vy: 0, airJumps: 1, spin: 0, steer: 0, lane: 1, pl: false, pr: false, pd: false, slideT: 0, slideAfter: false, jumpQ: false, slideQ: false,
    slowT: 0, boostT: 0, hitCool: 0, chase: -60 * R3.SEG, checkZ: 0, caught: false,
    count: 3.0, beep: 4, skyX: 0, floats: [], puffs: [], bump: 0, wobble: 0,
  };
  const seen = store.get('bilgi', []);
  let lights = 0, deeds = 0, cards = 0;
  for (const s of tr.segs) for (const o of s.objs) {
    if (o.kind === 'light') lights++;
    if (o.kind === 'good') deeds++;
    if (o.kind === 'card') { cards++; o.seen = seen.includes(o.id); }
  }
  S.datesTotal = tr.dates; S.lightsTotal = lights; S.deedsTotal = deeds; S.cardsTotal = cards; S.cardsGot = 0;
  updateHud();
}

const r3Seg = (z) => S.r3.segs[clamp(Math.floor(z / R3.SEG), 0, S.r3.N - 1)];
function r3Float(text, color) { S.r3.floats.push({ text, life: 1.1, color: color || '#fff3c0' }); }

function update3D(dt) {
  const r = S.r3;
  S.time += dt; S.ht += dt;
  if (r.count > 0) {
    r.count -= dt;
    const n = Math.ceil(r.count);
    if (n < r.beep) { r.beep = n; if (n > 0) Sound.tone(520, 0.18, 'square', 0.05); else Sound.tone(1040, 0.35, 'square', 0.06); }
    input._jumpPrev = input.jump; swipeQ.length = 0;
    r.pl = input.left; r.pr = input.right; r.pd = input.down;
    if (r.count <= 0 && !S.hints.serit) { S.hints.serit = true; toast(isTouch() ? 'Parmağını sağa-sola kaydır: şerit değiştir. Yukarı kaydır: zıpla. Aşağı kaydır: kay.' : '◀ ▶ şerit değiştir · ↑ / Boşluk zıpla · ↓ kay', 3600); }
    return;
  }
  const carZ = r.pos + R3.playerZ;
  const ps = r3Seg(carZ);
  const sp = r.speed / R3.MAXV;
  // Üç şerit: tuşa bir kez basınca (ya da parmağı kaydırınca) bir şerit kayar
  let dl = 0;
  if (input.left && !r.pl) dl--;
  if (input.right && !r.pr) dl++;
  if (input.down && !r.pd) r.slideQ = true;
  r.pl = input.left; r.pr = input.right; r.pd = input.down;
  while (swipeQ.length) { const q = swipeQ.shift(); if (q === 'L') dl--; else if (q === 'R') dl++; else if (q === 'U' || q === 'T') r.jumpQ = true; else if (q === 'D') r.slideQ = true; }
  if (dl) {
    const nl = clamp(r.lane + dl, 0, 2);
    if (nl !== r.lane) { r.lane = nl; Sound.tone(dl > 0 ? 660 : 600, 0.06, 'triangle', 0.035); }
    else { r.bump = 0.6; Sound.tone(220, 0.08, 'square', 0.03); }
  }
  const laneX = R3.LANES[r.lane];
  r.x += clamp(laneX - r.x, -dt * 7.5, dt * 7.5);
  r.steer = lerp(r.steer, clamp((laneX - r.x) * 4, -1, 1), Math.min(1, dt * 12));
  // Hız
  let target = R3.MAXV;
  const off = false;
  if (r.slowT > 0) { r.slowT -= dt; target = Math.min(target, R3.MAXV * 0.6); }
  if (r.boostT > 0) { r.boostT -= dt; target = R3.MAXV * 1.25; }
  r.speed += clamp(target - r.speed, -9000 * dt, (target > r.speed ? 4200 : 9000) * dt);
  r.pos += r.speed * dt;
  r.skyX += ps.curve * sp * dt * 0.025;
  if (r.hitCool > 0) r.hitCool -= dt;
  // Zıplama (havada bir kez daha)
  const pressed = (input.jump && !input._jumpPrev) || r.jumpQ;
  input._jumpPrev = input.jump; r.jumpQ = false;
  // Kayma: yerdeyken kısa bir süre eğilir; havadaysa hızla yere iner, sonra kayar
  if (r.slideQ) {
    r.slideQ = false;
    if (r.y > 0) { r.vy = -5200; r.slideAfter = true; }
    else { r.slideT = 0.7; Sound.tone(300, 0.12, 'sawtooth', 0.03); }
  }
  if (r.slideT > 0) { r.slideT -= dt; if (Math.random() < 0.6) r.puffs.push({ x: (Math.random() - 0.5) * 0.4, life: 0.4 }); }
  if (pressed) {
    r.slideT = 0; r.slideAfter = false;
    if (r.y <= 0) { r.vy = R3.V0; Sound.play('jump'); }
    else if (r.airJumps > 0) { r.airJumps--; r.vy = R3.V0 * 0.95; r.spin = 1; Sound.play('jump2'); }
  }
  if (r.y > 0 || r.vy > 0) {
    r.vy -= R3.G * dt;
    if (!input.jump && r.vy > 1100) r.vy = 1100;
    r.y += r.vy * dt;
    if (r.y <= 0) { r.y = 0; r.vy = 0; r.airJumps = 1; r.bump = 1; if (r.slideAfter) { r.slideAfter = false; r.slideT = 0.7; } }
  }
  if (r.spin > 0) r.spin = Math.max(0, r.spin - dt * 2.6);
  if (r.bump > 0) r.bump = Math.max(0, r.bump - dt * 5);
  r.wobble += dt * (off ? 30 : 0);
  if (off && r.speed > 1500 && Math.random() < 0.5) r.puffs.push({ x: (Math.random() - 0.5) * 0.3, life: 0.5 });
  for (const q of r.puffs) q.life -= dt;
  r.puffs = r.puffs.filter(q => q.life > 0);
  for (const f of r.floats) f.life -= dt;
  r.floats = r.floats.filter(f => f.life > 0);
  // Nesneler
  const i0 = Math.floor(carZ / R3.SEG);
  for (let i = i0 - 1; i <= i0 + 1; i++) {
    const s = r.segs[i]; if (!s) continue;
    for (const o of s.objs) {
      if (o.got || Math.abs(o.z - carZ) > R3.SEG * 0.75) continue;
      const dx = Math.abs(r.x - o.x);
      switch (o.kind) {
        case 'date': if (dx < 0.24 && Math.abs(r.y - o.h) < 330) { o.got = true; S.dates++; Sound.play('date'); updateHud(); } break;
        case 'light': if (dx < 0.28 && Math.abs(r.y - o.h) < 330) { o.got = true; S.lights++; Sound.play('light'); r3Float('Kayıp ışık!'); updateHud(); } break;
        case 'card': if (dx < 0.3 && Math.abs(r.y - o.h) < 350) { o.got = true; S.cardsGot++; updateHud(); Sound.play('light'); if (o.seen) toast('Bu bilgi yaprağını daha önce okumuştun.'); else openCard(o.id); } break;
        case 'good': if (dx < 0.3 && Math.abs(r.y - o.h) < 450) { o.got = true; S.deeds++; r.boostT = 1.3; r.chase -= 25 * R3.SEG; Sound.play('boost'); r3Float(o.label, '#fff2a0'); updateHud(); } break;
        case 'bad': if (!o.hit && dx < 0.24 && r.y < 300 && r.hitCool <= 0) { o.hit = true; r.slowT = 0.6; r.hitCool = 1; Sound.play('bonk'); r3Float(o.label + '!', '#d8d0f0'); } break;
        case 'bar': if (!o.hit && dx < 0.3 && !(r.slideT > 0 && r.y <= 0) && r.y < 650 && r.hitCool <= 0) { o.hit = true; r.slowT = 0.8; r.hitCool = 1; Sound.play('bonk'); r3Float(o.label + '!', '#d8d0f0'); } break;
        case 'mud': if (dx < 0.4 && r.y < 60) { r.slowT = Math.max(r.slowT, 0.3); if (!S.hints.camur) { S.hints.camur = true; toast(S.lv.r3v === 'snow' ? 'Buz kızağını yavaşlatır! Üstünden zıpla ya da kenarından geç.' : 'Çamur arabanı yavaşlatır! Üstünden zıpla ya da kenarından geç.'); } } break;
        case 'flag': if (!o.lit) { o.lit = true; r.checkZ = o.z - R3.playerZ; Sound.play('check'); toast('Fener yandı — buradan devam edeceksin.'); } break;
      }
    }
  }
  // İlk karşılaşmada ipuçları
  for (let i = i0 + 4; i < i0 + 26; i++) {
    const s = r.segs[i]; if (!s) break;
    for (const o of s.objs) {
      if (o.kind === 'bar' && !S.hints.bar) { S.hints.bar = true; toast(isTouch() ? 'Yüksek bulut! Altından geçmek için parmağını aşağı kaydır.' : 'Yüksek bulut! Altından geçmek için ↓ tuşuna bas.', 3200); }
      if (o.kind === 'bad' && !S.hints.kotu) { S.hints.kotu = true; toast('Kötü huy bulutlarına çarparsan yavaşlarsın. Şerit değiştir ya da zıpla!', 3200); }
      if (o.kind === 'good' && !S.hints.guzel) { S.hints.guzel = true; toast('Güzel huyları topla: hızlanırsın, kara bulut geri çekilir!', 3200); }
    }
  }
  // Kovalayan kara bulut
  r.chase += (S.easy ? 0.74 : 0.82) * R3.MAXV * dt;
  r.chase = Math.max(r.chase, r.pos - 90 * R3.SEG);
  if (r.chase >= r.pos) { r.caught = true; hurt(true); return; }
  // Bitiş
  if (carZ >= r.finishZ && S.mode === 'play') finishLevel();
}

function respawn3D() {
  const r = S.r3;
  if (S.lives <= 0) { S.mode = 'over'; showOver(); return; }
  r.pos = r.checkZ; r.speed = R3.MAXV * 0.3; r.x = 0; r.y = 0; r.vy = 0; r.lane = 1; r.slideT = 0; r.slideAfter = false;
  r.chase = r.pos - 80 * R3.SEG; r.slowT = 0; r.boostT = 0;
  S.mode = 'play'; S.fade = 0.6;
  if (r.caught) { r.caught = false; toast('Kötü huylar bulutu yetişti! Güzel huyları topla, hızını koru.', 3000); }
}

function view3DH() { return H; }

function render3D() {
  const r = S.r3, th = THEMES[S.lv.theme];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const VH = view3DH();
  const hor = VH * 0.5;
  // Gökyüzü
  const g = ctx.createLinearGradient(0, 0, 0, hor);
  g.addColorStop(0, th.skyA); g.addColorStop(0.7, th.skyB); g.addColorStop(1, th.skyC);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, VH);
  const sx = W * 0.78 - r.skyX * W * 0.4, sr = Math.min(W, VH) * 0.06;
  const sg = ctx.createRadialGradient(sx, VH * 0.14, 0, sx, VH * 0.14, sr * 4);
  sg.addColorStop(0, 'rgba(255,250,210,.9)'); sg.addColorStop(1, 'rgba(255,250,210,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx - sr * 4, VH * 0.14 - sr * 4, sr * 8, sr * 8);
  ctx.fillStyle = '#fff7cf'; ctx.beginPath(); ctx.arc(sx, VH * 0.14, sr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 331 - r.skyX * W * 0.8 + performance.now() / 90 * (0.2 + i * 0.03)) % (W + 300) + W + 300) % (W + 300) - 150, cy = VH * (0.08 + (i % 3) * 0.08), k = Math.min(W, VH) / 600;
    ctx.beginPath(); ctx.arc(cx, cy, 20 * k, 0, Math.PI * 2); ctx.arc(cx + 24 * k, cy - 9 * k, 25 * k, 0, Math.PI * 2); ctx.arc(cx + 50 * k, cy, 18 * k, 0, Math.PI * 2); ctx.fill();
  }
  // Tepeler (virajla kayan)
  const hill = (color, par, hgt, f) => {
    const sh = r.skyX * W * par;
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, hor + 2);
    for (let x = 0; x <= W + 20; x += 14) ctx.lineTo(x, hor - hgt * VH - Math.sin((x + sh) / (W * f)) * VH * 0.03 - Math.sin((x + sh) / (W * f * 0.37)) * VH * 0.012);
    ctx.lineTo(W, hor + 2); ctx.fill();
  };
  if (S.lv.r3v === 'snow') { hill('#e6eef8', 1.2, 0.12, 0.22); hill('#d4e0ee', 2.0, 0.05, 0.15); }
  else { hill('#a8d4a0', 1.2, 0.07, 0.22); hill('#86c27a', 2.0, 0.03, 0.15); }
  // Yol
  const segs = r.segs, N = r.N, pos = r.pos;
  const snowy = S.lv.r3v === 'snow';
  const baseI = Math.floor(pos / R3.SEG);
  const basePct = (pos % R3.SEG) / R3.SEG;
  const ps = r3Seg(pos + R3.playerZ), pPct = ((pos + R3.playerZ) % R3.SEG) / R3.SEG;
  const camY = lerp(ps.p1y, ps.p2y, pPct) + R3.CAMH;
  const camX = r.x * R3.ROADW;
  let x = 0, dx = -((segs[baseI] ? segs[baseI].curve : 0) * basePct);
  let maxy = VH;
  const P = (wy, wz, wx) => { const cz = wz - pos; const sc = R3.depth / cz; return [W / 2 + sc * (wx - camX) * W / 2, hor - sc * (wy - camY) * VH / 2, sc * R3.ROADW * W / 2, sc]; };
  const quad = (x1, y1, x2, y2, x3, y3, x4, y4, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); ctx.fill(); };

    const r1 = w1 * 1.14, r2 = w2 * 1.14;
    quad(x1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - r2, y2, s.c ? '#d63b30' : '#f4f4f0');
    quad(x1 + w1, y1, x1 + r1, y1, x2 + r2, y2, x2 + w2, y2, s.c ? '#d63b30' : '#f4f4f0');
    if (s.checker) {

        quad(x1 + w1 * t0, y1, x1 + w1 * t1, y1, x2 + w2 * t1, y2, x2 + w2 * t0, y2, (k + s.i) % 2 ? '#1e1e1e' : '#f4f4f0');

      if (s.c) for (const lx of [-1 / 3, 1 / 3]) { const l1 = w1 / 40, l2 = w2 / 40; quad(x1 + w1 * lx - l1, y1, x1 + w1 * lx + l1, y1, x2 + w2 * lx + l2, y2, x2 + w2 * lx - l2, y2, snowy ? '#9fb7d6' : '#f4f4f0'); }

  const jumpOff = r.y / R3.CAMH * VH / 2 * 0.9;
  const shake = (Math.abs(r.x) > 1.08 && r.y <= 0) ? Math.sin(r.wobble) * 3 : 0;
  const cx = W / 2 + r.steer * cw * 0.08, cy = VH - 6 - jumpOff + shake - r.bump * 4;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(W / 2, VH - 8, cw * 0.42 * (1 - Math.min(0.5, r.y / 2000)), cw * 0.06, 0, 0, Math.PI * 2); ctx.fill();
  for (const q of r.puffs) { ctx.globalAlpha = q.life * 1.4; ctx.fillStyle = snowy ? '#ffffff' : '#c9a874'; ctx.beginPath(); ctx.arc(W / 2 + q.x * cw * 2, VH - 14 - (0.5 - q.life) * 40, cw * 0.06 * (1.5 - q.life), 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (S.mode === 'dying') ctx.globalAlpha = Math.max(0, S.dieT / 0.75);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(r.steer * 0.08 + (r.spin > 0 ? (1 - r.spin) * Math.PI * 2 : 0));
  if (r.slideT > 0 && r.y <= 0) ctx.scale(1.1, 0.68);
  ctx.drawImage(car, -cw / 2, -ch, cw, ch);
  ctx.restore(); ctx.globalAlpha = 1;

    for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2 + S.time * 3, rr0 = Math.min(W, VH) * (0.35 + ((S.time * 2 + i * 0.37) % 1) * 0.3); ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * rr0, hor + Math.sin(a) * rr0 * 0.6); ctx.lineTo(W / 2 + Math.cos(a) * rr0 * 1.15, hor + Math.sin(a) * rr0 * 0.69); ctx.stroke(); }

    const tt = performance.now() / 1000;
    for (let i = 0; i < 80; i++) { const a = (i * 0.618) % 1, b2 = (i * 0.377) % 1; const fx = (((a * W + Math.sin(tt * 0.7 + i) * 20 - r.steer * tt * 30) % W) + W) % W, fy = ((b2 * VH + tt * (40 + b2 * 60)) % VH); ctx.fillRect(fx, fy, 2 + b2 * 2, 2 + b2 * 2); }
  }
  draw3DHud(VH, close);
  if (VH < H) { ctx.fillStyle = '#1a1230'; ctx.fillRect(0, VH, W, H - VH); }
  if (S.fade > 0) { ctx.fillStyle = `rgba(6,8,26,${S.fade})`; ctx.fillRect(0, 0, W, H); }
}

function draw3DHud(VH, close) {
  const r = S.r3;
  // Pist çubuğu
  const bw = Math.min(W * 0.5, 360), bx = (W - bw) / 2, by = 66;
  const pos = (z) => bx + clamp(z / r.finishZ, 0, 1) * bw;
  ctx.fillStyle = 'rgba(10,12,36,.55)'; ctx.fillRect(bx - 8, by - 9, bw + 16, 18);
  ctx.fillStyle = '#5b5e66'; ctx.fillRect(bx, by - 2, bw, 4);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (i + j) % 2 ? '#1e1e1e' : '#fff'; ctx.fillRect(bx + bw - 4 + j * 4, by - 8 + i * 4, 4, 4); }
  if (r.chase > 0) { ctx.fillStyle = '#3a3450'; ctx.beginPath(); ctx.arc(pos(r.chase + R3.playerZ), by, 7, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#8a84a8'; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.fillStyle = '#ffd56b'; ctx.beginPath(); ctx.arc(pos(r.pos + R3.playerZ), by, 6, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#a8701e'; ctx.lineWidth = 1.5; ctx.stroke();
  // Dikiz aynası: arkadaki kara bulut
  const mw = Math.min(130, W * 0.3), mh = mw * 0.32, mx = (W - mw) / 2, my = by + 14;
  ctx.fillStyle = '#2a2d36'; rr(ctx, mx - 4, my - 4, mw + 8, mh + 8, 10); ctx.fill();
  ctx.save(); rr(ctx, mx, my, mw, mh, 7); ctx.clip();
  const mg = ctx.createLinearGradient(0, my, 0, my + mh); mg.addColorStop(0, '#9fd6f4'); mg.addColorStop(0.55, '#cfeaf8'); mg.addColorStop(0.56, '#6cbf5a'); mg.addColorStop(1, '#5fb24f');
  ctx.fillStyle = mg; ctx.fillRect(mx, my, mw, mh);
  ctx.fillStyle = '#4a4d55'; ctx.beginPath(); ctx.moveTo(mx + mw * 0.47, my + mh * 0.56); ctx.lineTo(mx + mw * 0.53, my + mh * 0.56); ctx.lineTo(mx + mw * 0.85, my + mh); ctx.lineTo(mx + mw * 0.15, my + mh); ctx.fill();
  const cl = clamp(1 - (r.pos - r.chase) / (90 * R3.SEG), 0, 1);
  if (cl > 0.02) {
    ctx.fillStyle = 'rgba(52,46,72,.95)';
    const cr = mh * (0.25 + cl * 1.2);
    for (const [ox, oy] of [[-0.6, 0.1], [0, -0.15], [0.6, 0.1], [0, 0.25]]) { ctx.beginPath(); ctx.arc(mx + mw / 2 + ox * cr, my + mh * 0.55 + oy * cr, cr * 0.55, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
  ctx.strokeStyle = close > 0.5 ? '#e8506a' : '#8a8e98'; ctx.lineWidth = 2; rr(ctx, mx - 4, my - 4, mw + 8, mh + 8, 10); ctx.stroke();
  // Geri sayım
  if (r.count > 0) {
    const n = Math.ceil(r.count), f = r.count - Math.floor(r.count);
    ctx.save(); ctx.translate(W / 2, VH * 0.42); const sc = 1 + f * 0.6; ctx.scale(sc, sc);
    ctx.font = `900 ${Math.round(Math.min(W, VH) * 0.16)}px "Segoe UI", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(10,12,36,.75)'; ctx.strokeText(String(n), 0, 0);
    ctx.fillStyle = '#ffd56b'; ctx.fillText(String(n), 0, 0);
    ctx.restore(); ctx.textBaseline = 'alphabetic';
  } else if (r.count > -0.8) {
    r.count -= 1 / 60;
    ctx.font = `900 ${Math.round(Math.min(W, VH) * 0.14)}px "Segoe UI", sans-serif`; ctx.textAlign = 'center';
    ctx.globalAlpha = clamp(1 + r.count / 0.8, 0, 1);
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(10,12,36,.75)'; ctx.strokeText('BAŞLA!', W / 2, VH * 0.45);
    ctx.fillStyle = '#8fd86a'; ctx.fillText('BAŞLA!', W / 2, VH * 0.45); ctx.globalAlpha = 1;
  }
}

// =====================================================================
//  8. bölüm: Kuş bakışı labirent (Kursa Giden Yol)
// =====================================================================
const MZ = { CW: 13, CH: 9, SPEED: 140, R: 10 };

function buildMaze(seed) {
  const CW = MZ.CW, CH = MZ.CH, w = CW * 2 + 1, h = CH * 2 + 1;
  const r = rand(seed);
  const g = []; for (let y = 0; y < h; y++) g.push(new Array(w).fill(1));
  // Derinlemesine labirent (geri izlemeli)
  const seen = new Set(), stack = [[0, 0]];
  seen.add('0,0'); g[1][1] = 0;
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < CW && ny < CH && !seen.has(nx + ',' + ny));
    if (!nb.length) { stack.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.floor(r() * nb.length)];
    g[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0; g[ny * 2 + 1][nx * 2 + 1] = 0;
    seen.add(nx + ',' + ny); stack.push([nx, ny]);
  }
  // Birkaç ek geçit: çok sıkıcı çıkmaz olmasın
  let extra = 0;
  while (extra < 7) {
    const x = 1 + Math.floor(r() * (w - 2)), y = 1 + Math.floor(r() * (h - 2));
    if (g[y][x] !== 1) continue;
    if ((x % 2 === 0 && y % 2 === 1 && g[y][x - 1] === 0 && g[y][x + 1] === 0) || (x % 2 === 1 && y % 2 === 0 && g[y - 1][x] === 0 && g[y + 1][x] === 0)) { g[y][x] = 0; extra++; }
  }
  // Çıkış kapısı (sağ alt)
  const gx = w - 1, gy = h - 2; g[gy][gx] = 0;
  // Başlangıçtan uzaklık
  const dist = g.map(row => row.map(() => -1)); const q = [[1, 1]]; dist[1][1] = 0;
  while (q.length) { const [x, y] = q.shift(); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (g[ny] && g[ny][nx] === 0 && dist[ny][nx] < 0) { dist[ny][nx] = dist[y][x] + 1; q.push([nx, ny]); } } }
  // Çıkmaz sokaklar
  const dead = [];
  for (let y = 1; y < h - 1; y += 2) for (let x = 1; x < w - 1; x += 2) {
    if (x === 1 && y === 1) continue;
    const open = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => g[y + dy][x + dx] === 0).length;
    if (open === 1) dead.push({ x, y, d: dist[y][x] });
  }
  dead.sort((a, b) => b.d - a.d);
  return { g, w, h, gx, gy, dist, dead, r };
}

function setupMaze() {
  // Her oyunda yeni bir labirent
  const m = buildMaze(((Date.now() & 0xffffff) ^ Math.floor(Math.random() * 0xffffff)) >>> 0), T2 = T;
  const c = (tx, ty) => ({ x: tx * T2 + 16, y: ty * T2 + 16 });
  const ents = [];
  const used = new Set();
  // Önce çıkmaz sokaklar; yetmezse başlangıçtan en uzak koridor hücreleri
  const farCells = [];
  for (let y = 1; y < m.h - 1; y += 2) for (let x = 1; x < m.w - 1; x += 2) if (m.dist[y][x] > 8) farCells.push({ x, y, d: m.dist[y][x] });
  farCells.sort((a, b) => b.d - a.d);
  const take = () => { const d = m.dead.find(d => !used.has(d.x + ',' + d.y)) || farCells.find(d => !used.has(d.x + ',' + d.y)); if (d) used.add(d.x + ',' + d.y); return d; };
  // Bilgi yaprakları ve ışıklar en uzak çıkmazlarda
  for (const id of (S.lv.cardIds || ['c15', 'c16'])) { const d = take(); if (d) ents.push(Object.assign({ k: 'card', id, r: 14, ph: d.x % 6 }, c(d.x, d.y))); }
  for (let i = 0; i < 2; i++) { const d = take(); if (d) ents.push(Object.assign({ k: 'light', r: 12, ph: i * 2 }, c(d.x, d.y))); }
  // İyilikler: eşya bir çıkmazda, ihtiyaç sahibi labirentin başka bir yerinde
  const pairs = S.lv.pairs || [['kedicik', 'annekedi'], ['kova', 'fidan'], ['yem', 'guvercin']];
  const mid = [];
  for (let y = 1; y < m.h - 1; y += 2) for (let x = 1; x < m.w - 1; x += 2) if (m.dist[y][x] > 6 && !used.has(x + ',' + y)) mid.push({ x, y, d: m.dist[y][x] });
  pairs.forEach(([item, who], k) => {
    const d = take();
    if (d) ents.push(Object.assign({ k: 'item', item, held: false, used: false }, c(d.x, d.y)));
    const spot = mid.filter(p => !used.has(p.x + ',' + p.y) && Math.abs(p.d - (12 + k * 14)) < 6)[0] || mid.find(p => !used.has(p.x + ',' + p.y));
    if (spot) { used.add(spot.x + ',' + spot.y); ents.push(Object.assign({ k: 'recv', who, needs: item, done: false, t: 0 }, c(spot.x, spot.y))); }
  });
  // Hurmalar koridorlara serpiştirilir
  let dates = 0;
  for (let y = 1; y < m.h - 1; y++) for (let x = 1; x < m.w - 1; x++) {
    if (m.g[y][x] !== 0 || used.has(x + ',' + y) || (x === 1 && y === 1)) continue;
    if (m.r() < 0.16) { ents.push(Object.assign({ k: 'date', r: 10, ph: (x + y) % 6 }, c(x, y))); dates++; }
  }
  // Gezen kötü huy bulutları: labirentte serbestçe dolaşır (sabit bir yolları yok)
  const spots = [];
  for (let y = 1; y < m.h - 1; y += 2) for (let x = 1; x < m.w - 1; x += 2) if (m.g[y][x] === 0 && m.dist[y][x] > 9 && !used.has(x + ',' + y)) spots.push({ x, y });
  const cr = rand(Date.now() & 0xffff);
  const cc = S.lv.clouds || [7, 4];
  const nClouds = store.get('kolay', false) ? cc[1] : cc[0];
  const placed = [];
  for (let n = 0; n < 200 && placed.length < nClouds && spots.length; n++) {
    const sp = spots[Math.floor(cr() * spots.length)];
    if (placed.some(p => Math.abs(p.x - sp.x) + Math.abs(p.y - sp.y) < 6)) continue;
    placed.push(sp);
  }
  placed.forEach((sp, i) => ents.push({ k: 'mcloud', cx: sp.x, cy: sp.y, nx: sp.x, ny: sp.y, px: sp.x, py: sp.y, x: sp.x * T2 + 16, y: sp.y * T2 + 16,
    speed: 1.3 + cr() * 1.1, pause: 0.5 + cr() * 1.5, flee: 0, label: BAD_TRAITS[i % BAD_TRAITS.length] }));
  // Durum
  const seenT = m.g.map(row => row.map(() => false));
  S.ents = ents; S.barrels = [];
  S.mz = { m, seen: seenT, x: 1 * T2 + 16, y: 1 * T2 + 16, dir: 0, walkT: 0, stun: 0, kx: 0, ky: 0, carry: null, hitCool: 0, mapHint: isTouch() ? 9 : 4, mdir: null, qdir: null, swHint: false };
  S.datesTotal = dates; S.lightsTotal = ents.filter(e => e.k === 'light').length; S.deedsTotal = ents.filter(e => e.k === 'recv').length;
  S.cardsTotal = ents.filter(e => e.k === 'card').length; S.cardsGot = 0;
  const bil = store.get('bilgi', []);
  for (const e of ents) if (e.k === 'card') e.seen = bil.includes(e.id);
  S.p.carry = null;
  updateHud();
}

const mzWall = (tx, ty) => { const m = S.mz.m; return ty < 0 || ty >= m.h || tx < 0 || tx >= m.w ? true : m.g[ty][tx] === 1; };
function mzBlocked(x, y) {
  const R = MZ.R;
  for (const [cx, cy] of [[x - R, y - R], [x + R, y - R], [x - R, y + R], [x + R, y + R]]) if (mzWall(Math.floor(cx / T), Math.floor(cy / T))) return true;
  return false;
}

function updateMaze(dt) {
  const z = S.mz, m = z.m;
  S.time += dt; S.ht += dt;
  let ix = (input.right ? 1 : 0) - (input.left ? 1 : 0), iy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
  // Parmak hareketi: kaydırılan yöne duvara kadar yürür; yeni yön ilk açıklıkta alınır, dokununca durur
  const DIRS = { L: [-1, 0], R: [1, 0], U: [0, -1], D: [0, 1] };
  while (swipeQ.length) {
    const q = swipeQ.shift();
    if (q === 'T') { z.mdir = null; z.qdir = null; continue; }
    const d = DIRS[q]; if (!d) continue;
    if (!z.mdir || (z.mdir[0] === -d[0] && z.mdir[1] === -d[1])) { z.mdir = d; z.qdir = null; } else z.qdir = d;
  }
  if (ix || iy) { z.mdir = null; z.qdir = null; }
  else if (z.mdir && z.stun <= 0) {
    const ctx0 = Math.floor(z.x / T), cty = Math.floor(z.y / T);
    if (z.qdir && !mzWall(ctx0 + z.qdir[0], cty + z.qdir[1])) {
      const off = z.qdir[0] ? Math.abs(z.y - (cty * T + 16)) : Math.abs(z.x - (ctx0 * T + 16));
      if (off < 12) { z.mdir = z.qdir; z.qdir = null; }
    }
    ix = z.mdir[0]; iy = z.mdir[1];
  }
  const ox = z.x, oy = z.y;
  if (z.stun > 0) { z.stun -= dt; ix = 0; iy = 0; z.x += z.kx * dt; z.y += z.ky * dt; z.kx *= Math.pow(0.02, dt); z.ky *= Math.pow(0.02, dt); if (mzBlocked(z.x, z.y)) { z.x -= z.kx * dt; z.y -= z.ky * dt; z.kx = z.ky = 0; } }
  if (ix && iy) { ix *= 0.7071; iy *= 0.7071; }
  const sp = MZ.SPEED * dt;
  if (ix) {
    const nx = z.x + ix * sp;
    if (!mzBlocked(nx, z.y)) z.x = nx;
    else { // köşe yardımı: koridora hizala
      const cy = Math.floor(z.y / T) * T + 16, d = cy - z.y;
      if (Math.abs(d) < 13 && !mzBlocked(nx, cy)) z.y += Math.sign(d) * Math.min(Math.abs(d), sp);
    }
    z.dir = ix > 0 ? 0 : Math.PI;
  }
  if (iy) {
    const ny = z.y + iy * sp;
    if (!mzBlocked(z.x, ny)) z.y = ny;
    else {
      const cx = Math.floor(z.x / T) * T + 16, d = cx - z.x;
      if (Math.abs(d) < 13 && !mzBlocked(cx, ny)) z.x += Math.sign(d) * Math.min(Math.abs(d), sp);
    }
    z.dir = iy > 0 ? Math.PI / 2 : -Math.PI / 2;
  }
  if (ix && iy) z.dir = Math.atan2(iy, ix);
  if (z.mdir && z.stun <= 0 && Math.abs(z.x - ox) < 0.01 && Math.abs(z.y - oy) < 0.01) { z.mdir = null; ix = iy = 0; }
  z.walkT = (ix || iy) ? z.walkT + dt * 10 : 0;
  if (!z.swHint && isTouch() && S.time > 3.4) { z.swHint = true; toast('Parmağını kaydır: Kerem o yöne duvara kadar yürür. Parmağını kaldırmadan başka yöne çekersen ilk açıklıkta döner. Dokununca durur.', 4600); }
  // Gezilen yerler haritada açılır
  const ptx = Math.floor(z.x / T), pty = Math.floor(z.y / T);
  for (let y = pty - 2; y <= pty + 2; y++) for (let x = ptx - 2; x <= ptx + 2; x++) if (z.seen[y] && z.seen[y][x] !== undefined) z.seen[y][x] = true;
  if (z.mapHint > 0) { z.mapHint -= dt; if (z.mapHint <= 0) toast('Sağ üstteki harita gezdiğin yerleri gösterir. Kursun kapısı haritada parlıyor!', 3600); }
  if (z.hitCool > 0) z.hitCool -= dt;
  // Nesneler
  const near = (e, rr) => Math.hypot(e.x - z.x, e.y - z.y) < rr;
  for (const e of S.ents) {
    switch (e.k) {
      case 'date': if (!e.got && near(e, 20)) { e.got = true; S.dates++; Sound.play('date'); updateHud(); } break;
      case 'light': if (!e.got && near(e, 22)) { e.got = true; S.lights++; Sound.play('light'); burst(e.x, e.y, 16, '#ffe9a0', 150); floatText(e.x, e.y - 14, 'Kayıp ışık!'); updateHud(); } break;
      case 'card': if (!e.got && near(e, 22)) { e.got = true; S.cardsGot++; updateHud(); Sound.play('light'); if (e.seen) toast('Bu bilgi yaprağını daha önce okumuştun.'); else openCard(e.id); } break;
      case 'item':
        if (e.used) break;
        if (e.held) { e.x = z.x; e.y = z.y - 22; break; }
        if (!z.carry && near(e, 20)) {
          e.held = true; z.carry = e; S.p.carry = e; Sound.play('pick');
          toast({ kedicik: 'Kaybolmuş yavru kediyi buldun. Annesine götür!', kova: 'Su kovasını aldın. Kurumuş fidanı sula!', yem: 'Yem kesesini aldın. Güvercinleri bul!', mum: 'Bir mum buldun. Yaşlı komşunun karanlık evine götür!', kutu: 'Battaniyeli bir kutu buldun. Üşüyen yavru kediye götür!' }[e.item]); updateHud();
        }
        break;
      case 'recv':
        if (e.done) { e.t += dt; break; }
        if (!near(e, 34)) break;
        if (z.carry && z.carry.item === e.needs) {
          e.done = true; e.t = 0; z.carry.used = true; z.carry.held = false; z.carry = null; S.p.carry = null;
          S.deeds++; Sound.play('deed'); burst(e.x, e.y - 10, 18, '#ff9fb0', 120); floatText(e.x, e.y - 40, '♥');
          toast({ annekedi: 'İyilik: Yavru kedi annesine kavuştu!', fidan: 'İyilik: Kurumuş fidanı suladın!', guvercin: 'İyilik: Güvercinlere yem verdin!', komsuev: 'İyilik: Komşunun evi aydınlandı!', yavrukedi: 'İyilik: Yavru kedi artık sıcacık!' }[e.who]); updateHud();
        } else if (S.hintCool <= 0) {
          S.hintCool = 3.5; Sound.play('hint');
          toast({ annekedi: 'Anne kedi yavrusunu arıyor. Labirentte bir yerde olmalı!', fidan: 'Bu fidan kurumuş. Bir su kovası bulabilir misin?', guvercin: 'Güvercinler aç. Bir yem kesesi bulabilir misin?', komsuev: 'Yaşlı komşunun evi karanlıkta kaldı. Bir mum bulabilir misin?', yavrukedi: 'Bu yavru kedi üşüyor. Ona sıcak bir yer bulabilir misin?' }[e.who]);
        }
        break;
      case 'mcloud': {
        if (e.flee > 0) e.flee -= dt;
        if (e.pause > 0) e.pause -= dt;
        else {
          const tx = e.nx * T + 16, ty = e.ny * T + 16, d = Math.hypot(tx - e.x, ty - e.y);
          const step = e.speed * T * dt * (S.easy ? 0.7 : 1);
          if (d <= step) {
            e.x = tx; e.y = ty; e.px = e.cx; e.py = e.cy; e.cx = e.nx; e.cy = e.ny;
            let opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [e.cx + dx, e.cy + dy]).filter(([ax, ay]) => !mzWall(ax, ay) && !(ax === m.gx && ay === m.gy));
            if (opts.length > 1) opts = opts.filter(([ax, ay]) => !(ax === e.px && ay === e.py));
            const pdx = z.x / T, pdy = z.y / T, distP = Math.abs(pdx - e.cx) + Math.abs(pdy - e.cy);
            let pick;
            if (e.flee > 0) pick = opts.sort((a, b) => (Math.abs(b[0] - pdx) + Math.abs(b[1] - pdy)) - (Math.abs(a[0] - pdx) + Math.abs(a[1] - pdy)))[0];
            else if (distP < 9 && Math.random() < 0.35) pick = opts.sort((a, b) => (Math.abs(a[0] - pdx) + Math.abs(a[1] - pdy)) - (Math.abs(b[0] - pdx) + Math.abs(b[1] - pdy)))[0];
            else pick = opts[Math.floor(Math.random() * opts.length)];
            if (pick) { e.nx = pick[0]; e.ny = pick[1]; }
            if (Math.random() < 0.1) e.pause = 0.4 + Math.random() * 1.1;
            if (Math.random() < 0.15) e.speed = 1.2 + Math.random() * 1.2;
          } else { e.x += (tx - e.x) / d * step; e.y += (ty - e.y) / d * step; }
        }
        if (!S.hints.mbulut && Math.hypot(e.x - z.x, e.y - z.y) < 160) { S.hints.mbulut = true; toast('Kötü huy bulutları labirentte dolaşıyor! Çarparsan geri itilirsin. Uzaklaşmalarını bekle ya da başka yoldan git.', 3600); }
        if (z.hitCool <= 0 && Math.hypot(e.x - z.x, e.y - z.y) < 24) {
          z.hitCool = 1.2; z.stun = 0.5; z.mdir = null; z.qdir = null; e.flee = 2.5; e.nx = e.cx; e.ny = e.cy;
          const a = Math.atan2(z.y - e.y, z.x - e.x); z.kx = Math.cos(a) * 260; z.ky = Math.sin(a) * 260;
          Sound.play('bonk'); floatText(z.x, z.y - 30, e.label + '! Sabırlı ol.');
        }
        break;
      }
    }
  }
  if (S.hintCool > 0) S.hintCool -= dt;
  updateParts(dt);
  // Kapı
  if (ptx >= m.gx - 1 && pty === m.gy && z.x > (m.gx - 0.4) * T && S.mode === 'play') finishLevel();
}

function drawKeremTop(x, y, dir, walkT) {
  ctx.save(); ctx.translate(x, y);

  const list = rows.filter(x => x.document).map(x => { const f = x.document.fields || {}; return { ad: (f.ad || {}).stringValue || '?', oyuncu: x.document.name.split('/').pop(), puan: +((f.puan || {}).integerValue || 0), yildiz: +((f.yildiz || {}).integerValue || 0) }; });
  lbCache = { at: Date.now(), list };
  return list;
}

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump' };
const KEYMAP2 = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
window.addEventListener('keydown', (e) => {
  Sound.init();
  const k = KEYMAP[e.code], k2 = KEYMAP2[e.code];
  if ((k || k2) && S.mode === 'play') { if (k) input[k] = true; if (k2) input[k2] = true; e.preventDefault(); return; }
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (S.mode === 'play') pause(); else if (S.mode === 'pause') resume(); else if (S.mode === 'card') closeCard();
    e.preventDefault();
  }
});
window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code], k2 = KEYMAP2[e.code]; if (k) input[k] = false; if (k2) input[k2] = false; });
window.addEventListener('blur', () => { input.left = input.right = input.jump = input.up = input.down = false; if (S.mode === 'play') pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') pause(); });
$('pauseBtn').addEventListener('click', (e) => { e.preventDefault(); pause(); });

const touchEl = $('touch');
function enableTouch() {
  if (touchEl.classList.contains('show')) return;
  touchEl.classList.add('show'); resize();
}
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) enableTouch();
window.addEventListener('touchstart', enableTouch, { passive: true });

// Sol taraf: parmağın ◀ ve ▶ arasında kaymasına izin veren alan
const padL = $('padL'), padR = $('padR'), padJ = $('padJ'), padZone = $('padZone');
const movePointers = new Map();
function refreshMove() {
  let l = false, r = false;
  const split = padR.getBoundingClientRect().left - 6;
  for (const x of movePointers.values()) { if (x < split) l = true; else r = true; }
  input.left = l; input.right = r;
  padL.classList.toggle('on', l); padR.classList.toggle('on', r);
}
for (const el of [padZone, padL, padR]) {
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); Sound.init(); try { el.setPointerCapture(e.pointerId); } catch (_) {} movePointers.set(e.pointerId, e.clientX); refreshMove(); });
  el.addEventListener('pointermove', (e) => { if (movePointers.has(e.pointerId)) { movePointers.set(e.pointerId, e.clientX); refreshMove(); } });
  const up = (e) => { movePointers.delete(e.pointerId); refreshMove(); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
const jumpPointers = new Set();
padJ.addEventListener('pointerdown', (e) => { e.preventDefault(); Sound.init(); try { padJ.setPointerCapture(e.pointerId); } catch (_) {} jumpPointers.add(e.pointerId); input.jump = true; padJ.classList.add('on'); });
const jup = (e) => { jumpPointers.delete(e.pointerId); if (!jumpPointers.size) { input.jump = false; padJ.classList.remove('on'); } };
padJ.addEventListener('pointerup', jup); padJ.addEventListener('pointercancel', jup); padJ.addEventListener('lostpointercapture', jup);
for (const [id, key] of [['padU', 'up'], ['padD', 'down']]) {
  const el = $(id), ptrs = new Set();
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); Sound.init(); try { el.setPointerCapture(e.pointerId); } catch (_) {} ptrs.add(e.pointerId); input[key] = true; el.classList.add('on'); });
  const off = (e) => { ptrs.delete(e.pointerId); if (!ptrs.size) { input[key] = false; el.classList.remove('on'); } };
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
for (const el of [padZone, padL, padR, padJ, cv]) el.addEventListener('contextmenu', (e) => e.preventDefault());
// Yarışta parmak hareketi: sağa/sola kaydır = şerit, yukarı = zıpla, aşağı = kay, dokun = zıpla
let swipe = null;
// Parmak kalkmadan yön değiştirilebilir: her yeni yöne ~26 piksel kayınca o yön işlenir, başlangıç noktası oraya taşınır
window.addEventListener('pointerdown', (e) => {
  if ((!S.r3 && !S.mz && !S.sn) || S.mode !== 'play') return;
  if (e.target.closest && e.target.closest('button, #overlay, #hud')) return;
  Sound.init();
  swipe = { id: e.pointerId, ax: e.clientX, ay: e.clientY, t: performance.now(), moved: false, last: null };
});
window.addEventListener('pointermove', (e) => {
  if (!swipe || swipe.id !== e.pointerId) return;
  const dx = e.clientX - swipe.ax, dy = e.clientY - swipe.ay, adx = Math.abs(dx), ady = Math.abs(dy);
  const dir = adx > ady ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
  const th = (S.r3 && dir === swipe.last) ? 44 : 26;   // yarışta aynı yöne devam edince bir şerit daha
  if (Math.max(adx, ady) < th) return;
  if (dir !== swipe.last && Math.max(adx, ady) < 1.2 * Math.min(adx, ady)) return;   // çapraz kararsızlıkta bekle
  if (dir !== swipe.last || S.r3) swipeQ.push(dir);
  swipe.last = dir; swipe.moved = true; swipe.ax = e.clientX; swipe.ay = e.clientY;
});
const swipeEnd = (e) => { if (!swipe || swipe.id !== e.pointerId) return; if (!swipe.moved && performance.now() - swipe.t < 320) swipeQ.push('T'); swipe = null; };
window.addEventListener('pointerup', swipeEnd); window.addEventListener('pointercancel', swipeEnd);
document.addEventListener('gesturestart', (e) => e.preventDefault());
// Telefonda çift dokunuşun ekranı yakınlaştırmasını engelle (iPhone Safari user-scalable=no'yu yok sayar)
for (const el of [padZone, padL, padR, padJ, $('padU'), $('padD'), cv]) el.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd < 400 && e.cancelable && !(e.target.closest && e.target.closest('#overlay, button'))) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// =====================================================================
//  Test yardımcısı (oyun mantığını görüntüsüz ilerletir)
// =====================================================================
window.FY = {
  S, LEVELS, input,
  start: (i) => startLevel(i),
  // keys: {left,right,jump}; secs: süre. Oyunu sabit adımlarla ilerletir.
  sim(keys, secs) {
    Object.assign(input, { left: false, right: false, jump: false, up: false, down: false }, keys);
    const n = Math.round(secs / STEP);
    for (let i = 0; i < n; i++) update(STEP);
    const p = S.p;
    return { mode: S.mode, x: +(p.x / T).toFixed(2), y: +(p.y / T).toFixed(2), ground: p.onGround, lives: S.lives, dates: S.dates, lights: S.lights, deeds: S.deeds, carry: p.carry && p.carry.item };
  },
  swipe(d) { swipeQ.push(d); },
  tp(tx, ty) { const p = S.p; p.x = tx * T + (T - PW) / 2; p.y = ty * T + T - PH; p.vx = p.vy = 0; },
};

// Başlat
resize();
showMenu();
// Yalnızca yerel testte: ?test=bölüm,karo  (ör. ?test=3,171) doğrudan o noktadan başlatır
(() => {
  const q = new URLSearchParams(location.search).get('test');
  if (!q || !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  const [lv, tx] = q.split(',').map(Number);
  startLevel(clamp((lv || 1) - 1, 0, LEVELS.length - 1));
  if (tx) { window.FY.tp(tx, 1); for (let i = 0; i < 240; i++) update(STEP); }
})();
requestAnimationFrame(frame);
})();
</script>
